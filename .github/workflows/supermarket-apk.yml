name: سوبرماركت برو — بناء تطبيق أندرويد

on:
  push:
    branches: [main]
    paths:
      - 'supermarket/android/**'
      - '.github/workflows/supermarket-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supermarket-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key (created on the build machine only, never saved in the repo)
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias app -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Supermarket Pro, O=Supermarket Pro, C=IQ"
          FP=$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias app | sed -n 's/^.*SHA256: //p' | head -1)
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASS=$PASS"
            echo "KEY_ALIAS=app"
            echo "FP=$FP"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -o pipefail
          gradle -p supermarket/android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Save result to branch android-build
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || echo "no log" > out/build.log
          APK=supermarket/android/app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then cp "$APK" out/supermarket-pro.apk; echo ok > out/status.txt; else echo failed > out/status.txt; fi
          echo "$FP" > out/sha256.txt
          echo "${{ github.run_number }}" > out/run.txt
          cd out
          git init -q
          git checkout -q -b android-build
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build
