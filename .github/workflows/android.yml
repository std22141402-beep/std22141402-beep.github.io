name: Android app (PWABuilder / TWA)

on:
  push:
    branches: [main]
    paths: ['android/request.json']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: salka-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build, sign and verify
        env:
          SALKA_KEYSTORE_B64: ${{ secrets.SALKA_KEYSTORE_B64 }}
          SALKA_KEYSTORE_PASS: ${{ secrets.SALKA_KEYSTORE_PASS }}
          SALKA_KEY_PASS: ${{ secrets.SALKA_KEY_PASS }}
          SALKA_KEY_ALIAS: ${{ secrets.SALKA_KEY_ALIAS }}
        run: node android/build.mjs

      - name: Publish build output to the salka-android-build branch
        if: always()
        run: |
          mkdir -p _out
          [ -f _out/status.json ] || echo '{"status":"crashed"}' > _out/status.json
          rm -rf _out/secure
          cd _out
          git init -q -b salka-android-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Android build #${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" salka-android-build
