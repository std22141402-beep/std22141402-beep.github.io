          const d = { id: uid(), type: 'fx', num: A.nextNum('fx'), date: rs.to, rate100: r100, cur: 'IQD', lines, note: 'إعادة تقييم بسعر ' + E.fmt(r100 * 1000, 0) };
          const ck = A.checkDoc(d); if (ck.error) { toast(ck.error, 'bad'); return; }
          await A.saveDoc(d); A.vs.fxInit = false; toast('انرحل قيد الفروقات', 'good');
        };
        ctx.csv = () => [['الحساب', 'الدولار', 'المسجل', 'الحالي', 'الفرق']].concat(list.map(x => [x.acc.name, E.fmt(x.usd, 2), E.fmt(x.booked, 0), E.fmt(x.target, 0), E.fmt(x.diff, 0)]));
        ctx.print = () => `<h2>فروقات أسعار الصرف بسعر ${E.fmt(r100 * 1000, 0)} لكل 100$</h2>` + ctx.out.innerHTML;
      };
      filters(ctx, [{ k: 'to', l: 'بتاريخ', type: 'date', def: today() }, { k: 'rate', l: 'سعر 100$', type: 'num', def: E.fmt(rate100() * 1000, 0) }], draw);
      draw();
    },
  };

  /* ───────── التفقيط (المبلغ كتابةً) ───────── */
  const ONES = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
  const TENS = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
  const HUND = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
  function below1000(n) {
    const h = Math.floor(n / 100), r = n % 100; const parts = [];
    if (h) parts.push(HUND[h]);
    if (r) { if (r < 20) parts.push(ONES[r]); else { const o = r % 10, t = Math.floor(r / 10); parts.push(o ? ONES[o] + ' و' + TENS[t] : TENS[t]); } }
    return parts.join(' و');
  }
  function scale(n, one, two, few, many) {
    if (n === 1) return one; if (n === 2) return two;
    if (n >= 3 && n <= 10) return below1000(n) + ' ' + few;
    return below1000(n) + ' ' + many;
  }
  function tafqeet(num) {
    num = Math.floor(Math.abs(num)); if (!num) return 'صفر';
    const b = Math.floor(num / 1e9), m = Math.floor(num % 1e9 / 1e6), k = Math.floor(num % 1e6 / 1e3), r = num % 1000; const parts = [];
    if (b) parts.push(scale(b, 'مليار', 'ملياران', 'مليارات', 'مليار'));
    if (m) parts.push(scale(m, 'مليون', 'مليونان', 'ملايين', 'مليون'));
    if (k) parts.push(scale(k, 'ألف', 'ألفان', 'آلاف', 'ألف'));
    if (r) parts.push(below1000(r));
    return parts.join(' و');
  }
  A.tafqeet = (milli, cur) => {
    const d = A.dec(cur); const whole = Math.floor(Math.abs(milli) / 1000); const frac = Math.round((Math.abs(milli) % 1000) / Math.pow(10, 3 - d));
    let s = 'فقط ' + tafqeet(whole) + (cur === 'USD' ? ' دولار' : ' دينار عراقي');
    if (frac && cur === 'USD') s += ' و' + tafqeet(frac) + ' سنت';
    return s + ' لا غير';
  };

  /* ───────── الطباعة ───────── */
  const PRINT_CSS = `body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:#111;margin:0;padding:18px;direction:rtl;font-size:13px}
    .doc{max-width:780px;margin:0 auto}.doc.t80{max-width:300px;font-size:12px}
    .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid #0D5C57;padding-bottom:10px;margin-bottom:10px}
    .hd h1{margin:0;font-size:20px;color:#0D5C57}.hd .t{font-size:17px;font-weight:700;text-align:left}
    .t80 .hd{display:block;text-align:center}.t80 .hd .t{text-align:center}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-bottom:10px}.t80 .meta{grid-template-columns:1fr}
    table{width:100%;border-collapse:collapse;margin:8px 0}th,td{border:1px solid #ccc;padding:5px 7px;text-align:right}th{background:#EEF3F2}
    td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
    .t80 th,.t80 td{border:0;border-bottom:1px dashed #999;padding:3px 2px}
    .tot{width:auto;min-width:280px;margin-inline-start:auto}.t80 .tot{width:100%}
    .tot td{border:0;border-bottom:1px solid #ddd}.tot tr.b td{font-weight:700;font-size:15px;border-top:2px solid #111}
    .words{margin-top:8px;padding:7px;background:#F4F7F6;border-radius:6px}.foot{margin-top:18px;text-align:center;color:#555;font-size:12px}
    .sig{display:flex;justify-content:space-between;margin-top:36px}.sig div{border-top:1px solid #999;padding-top:4px;min-width:160px;text-align:center}
    .chip{display:inline-block;padding:0 6px;border-radius:9px;background:#eee;font-size:11px}.muted{color:#666}.small{font-size:11.5px}
    .kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{border:1px solid #ccc;border-radius:6px;padding:6px 10px}.kpi .k{display:block;color:#666;font-size:11px}.kpi .v{font-weight:700;font-size:15px}
    .card{margin:6px 0}.card-h{display:flex;gap:8px;align-items:center}.card-h h2{font-size:15px;margin:8px 0}.btn,button,input{display:none}a{color:inherit;text-decoration:none}
    @media print{body{padding:0}@page{margin:10mm}}`;
  function scopeCss(css, scope) {

  }
  function wrapPrint(title, inner, small) {
    return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"><style>${PRINT_CSS}</style></head><body><div class="doc ${small ? 't80' : ''}">${inner}</div><script>window.addEventListener('load',function(){setTimeout(function(){window.print()},400)})<\/script></body></html>`;
  }
  function header(title, num, date) {

    return `<div class="hd"><div><h1>${esc(c.name || '')}</h1><div class="small">${esc(c.address || '')}${c.phone ? ' · ' + esc(c.phone) : ''}</div></div><div class="t">${esc(title)}${num != null ? `<div class="small">رقم ${esc(num)}</div>` : ''}${date ? `<div class="small">${esc(date)}</div>` : ''}</div></div>`;
  }
  // طباعة مباشرة (التطبيق المستقل): تُعرض الورقة وحدها للطابعة
  function printNow(bodyHtml) {
    let root = document.getElementById('printroot');
    if (!root) { root = document.createElement('div'); root.id = 'printroot'; document.body.appendChild(root); }
    root.innerHTML = `<style>${scopeCss(PRINT_CSS, '#printroot')}</style><div dir="rtl">${bodyHtml}</div>`;
    document.documentElement.classList.add('printing');
    const done = () => { document.documentElement.classList.remove('printing'); root.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);

  }
  async function previewAndSave(title, html, filename) {
    const body = html.replace(/^[\s\S]*<body>/, '').replace(/<script[\s\S]*$/, '');
    if (A.device) {
      await modal({
        title: 'معاينة الطباعة', wide: true, body: `<div class="pv"><style>${scopeCss(PRINT_CSS, '.pv-x')}</style><div class="pv-x" dir="rtl">${body}</div></div><p class="muted small">"طباعة" تفتح الطابعة أو تحفظ PDF. "مشاركة" ترسل الملف بالواتساب أو تحفظه بالملفات.</p>`,
        actions: [{ label: 'إغلاق', value: null }, { label: 'مشاركة', onClick: () => { A.download(filename, html); return false; } }, { label: 'طباعة / PDF', cls: 'pri', onClick: () => { printNow(body); return false; } }],
      });
      return;
    }
    const r = await modal({
      title: 'معاينة الطباعة', wide: true, body: `<div class="pv"><style>${scopeCss(PRINT_CSS, '.pv-x')}</style><div class="pv-x" dir="rtl">${body}</div></div><p class="muted small">ينزل ملف يفتح بالمتصفح ويطبع مباشرة (A4 أو حراري حسب الإعدادات).</p>`,
      actions: [{ label: 'إغلاق', value: null }, { label: 'تنزيل للطباعة', cls: 'pri', value: 'dl' }],
    });
    if (r === 'dl') A.download(filename, html);
  }
  A.printHTML = (title, inner) => { const html = wrapPrint(title, header(title, null, today()) + inner); previewAndSave(title, html, title + '-' + today() + '.html'); };

  A.printDoc = function (id, S) {
    S = S || A.S; const d = A.data.docs.get(id) || (S && S.docIndex.get(id)); if (!d) { toast('المستند غير موجود', 'bad'); return; }
    const small = st().print === '80'; const t = T[d.type]; const cur = d.cur || 'IQD'; const mny = v => E.fmt(v, A.dec(cur));
    let inner = header(t.name, d.num, d.date);
    if (t.inv) {
      const C = E.calcInvoice(d); const party = d.party ? A.acc(d.party) : null;
      inner += `<div class="meta"><div><b>${d.type === 'purchase' || d.type === 'pret' ? 'المورد' : 'الزبون'}:</b> ${esc(party ? party.name : 'نقدي')}</div>${party && party.phone ? `<div><b>الهاتف:</b> ${esc(party.phone)}</div>` : ''}<div><b>العملة:</b> ${CUR_NAME[cur]}${cur === 'USD' ? ' (سعر 100$ = ' + E.fmt(d.rate100 * 1000, 0) + ')' : ''}</div>${d.rep ? `<div><b>المندوب:</b> ${esc(((st().reps || []).find(r => r.id === d.rep) || {}).name || '')}</div>` : ''}</div>`;
      inner += `<table><thead><tr><th>#</th><th>المادة</th><th>الوحدة</th><th class="n">الكمية</th><th class="n">السعر</th>${C.lineDisc ? '<th class="n">الخصم</th>' : ''}<th class="n">المجموع</th></tr></thead><tbody>${d.lines.map((l, i) => { const it = A.item(l.item) || { name: '?', units: [] }; return `<tr><td>${i + 1}</td><td>${esc(it.name)}</td><td>${esc(((it.units || [])[l.unit || 0] || {}).name || '')}</td><td class="n">${qtyF(l.qty)}</td><td class="n">${mny(l.price)}</td>${C.lineDisc ? `<td class="n">${l.disc ? mny(l.disc) : ''}</td>` : ''}<td class="n">${mny(C.rows[i].net)}</td></tr>`; }).join('')}</tbody></table>`;
      inner += `<table class="tot"><tr><td>المجموع</td><td class="n">${mny(C.sub)}</td></tr>${C.disc ? `<tr><td>الخصم</td><td class="n">${mny(C.disc)}</td></tr>` : ''}<tr class="b"><td>الصافي</td><td class="n">${mny(C.total)} ${CUR_LBL[cur]}</td></tr>`;
      if (d.type !== 'quote') inner += `<tr><td>${d.type === 'purchase' ? 'المدفوع' : 'الواصل'}</td><td class="n">${mny(d.paid || 0)}</td></tr><tr><td>الباقي</td><td class="n">${mny(C.total - (d.paid || 0))}</td></tr>`;
      if (party && d.type !== 'quote' && S) {
        const sg = d.type === 'purchase' || d.type === 'pret' ? -1 : 1;
        const stt = E.statement(S, d.party, { cur }); let after = 0, before = 0; let seen = false;
        stt.rows.forEach(r => { if (r.doc === d.id) { seen = true; after = r.bal; } });
        const idxs = (S.entries.get(d.id) || []).filter(i => S.lines[i].acc === d.party && S.lines[i].cur === cur); const eff = idxs.reduce((a, i) => a + S.lines[i].amt, 0);
        if (seen) { before = after - eff; inner += `<tr><td>الرصيد السابق</td><td class="n">${mny(sg * before)}</td></tr><tr class="b"><td>الرصيد الحالي</td><td class="n">${mny(sg * after)}</td></tr>`; }
      }
      inner += `</table><div class="words">${esc(A.tafqeet(C.total, cur))}</div>`;
      if (d.note) inner += `<p><b>ملاحظات:</b> ${esc(d.note)}</p>`;
      if (!small) inner += `<div class="sig"><div>المستلم</div><div>المحاسب</div></div>`;
    } else if (d.type === 'receipt' || d.type === 'payment') {
      const pc = d.pcur || d.cur;
      inner += `<div class="meta"><div><b>${d.type === 'receipt' ? 'استلمنا من' : 'صرفنا إلى'}:</b> ${esc(A.accName(d.party))}</div><div><b>${d.type === 'receipt' ? 'إلى صندوق' : 'من صندوق'}:</b> ${esc(A.accName(d.acc))}</div></div>
        <table class="tot" style="width:100%"><tr class="b"><td>المبلغ</td><td class="n">${E.fmt(d.amt, A.dec(d.cur))} ${CUR_LBL[d.cur]}</td></tr>${pc !== d.cur ? `<tr><td>يعادل بعملة الحساب</td><td class="n">${E.fmt(d.pamt, A.dec(pc))} ${CUR_LBL[pc]} (سعر 100$ = ${E.fmt(d.rate100 * 1000, 0)})</td></tr>` : ''}${d.discount ? `<tr><td>خصم</td><td class="n">${E.fmt(d.discount, A.dec(pc))} ${CUR_LBL[pc]}</td></tr>` : ''}
        <tr><td>رصيد الحساب الآن</td><td class="n">${E.fmt(A.balOf(d.party)[pc], A.dec(pc))} ${CUR_LBL[pc]}</td></tr></table>
        <div class="words">${esc(A.tafqeet(d.amt, d.cur))}</div>${d.note ? `<p><b>البيان:</b> ${esc(d.note)}</p>` : ''}<div class="sig"><div>المستلم</div><div>المحاسب</div></div>`;
    } else {
      const idxs = (S && S.entries.get(d.id)) || [];
      if (d.type === 'transfer' || d.type === 'adjust' || d.type === 'open') inner += `<div class="meta"><div><b>المخزن:</b> ${esc(A.whName(d.wh))}${d.wh2 ? ' ← ' + esc(A.whName(d.wh2)) : ''}</div></div><table><thead><tr><th>المادة</th><th>الوحدة</th><th class="n">${d.type === 'adjust' && d.reason === 'count' ? 'الكمية الفعلية' : 'الكمية'}</th></tr></thead><tbody>${d.lines.map(l => { const it = A.item(l.item) || { units: [] }; return `<tr><td>${esc(it.name)}</td><td>${esc(((it.units || [])[l.unit || 0] || {}).name || '')}</td><td class="n">${qtyF(l.count != null ? l.count : l.qty)}</td></tr>`; }).join('')}</tbody></table>`;
      if (idxs.length) inner += `<table><thead><tr><th>الحساب</th><th class="n">مدين د.ع</th><th class="n">دائن د.ع</th><th>البيان</th></tr></thead><tbody>${idxs.map(i => { const l = S.lines[i]; return `<tr><td>${esc(A.accName(l.acc))}${l.cur === 'USD' && l.amt ? ` <span class="chip">${E.fmt(l.amt, A.dec('USD'))} $</span>` : ''}</td><td class="n">${l.base > 0 ? E.fmt(l.base, 0) : ''}</td><td class="n">${l.base < 0 ? E.fmt(-l.base, 0) : ''}</td><td class="small">${esc(l.memo || '')}</td></tr>`; }).join('')}</tbody></table>`;
      if (d.note) inner += `<p><b>البيان:</b> ${esc(d.note)}</p>`;
    }
    inner += `<div class="foot">${esc((st().company || {}).footer || '')}</div>`;
    previewAndSave(t.name, wrapPrint(t.name + ' ' + (d.num || ''), inner, small), t.short + '-' + (d.num || '') + '.html');
  };
})();
