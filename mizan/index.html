<title>ميزان للمحاسبة والمخازن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
:root {
  /* ميزان: دفتر أستاذ حديث — أخضر بترولي هادئ، أرقام جدولية، كثافة معلومات عالية */
  --bg: #F2F4F3; --surface: #FFFFFF; --surface2: #EBF0EE; --ink: #13201E; --muted: #5B6B68; --line: #D6DFDC;
  --accent: #0D5C57; --accent-ink: #FFFFFF; --accent-soft: #D9ECE8;
  --usd: #8A5F06; --usd-soft: #F6ECD4;
  --good: #1D7745; --good-soft: #DDF1E4; --warn: #A86200; --warn-soft: #FBEBD3; --bad: #B3261E; --bad-soft: #F9DEDB;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --display: "Readex Pro", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --r: 10px; --shadow: 0 1px 2px rgba(10, 30, 28, .06), 0 6px 24px rgba(10, 30, 28, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1514; --surface: #151E1D; --surface2: #1B2725; --ink: #E4ECEA; --muted: #91A29F; --line: #2A3836;
    --accent: #52B5AA; --accent-ink: #04201D; --accent-soft: #173B37; --usd: #E0B04A; --usd-soft: #3A2E12;
    --good: #5CC98A; --good-soft: #143523; --warn: #F0A848; --warn-soft: #3A2A12; --bad: #F2776D; --bad-soft: #3D1A17;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 24px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1514; --surface: #151E1D; --surface2: #1B2725; --ink: #E4ECEA; --muted: #91A29F; --line: #2A3836;
  --accent: #52B5AA; --accent-ink: #04201D; --accent-soft: #173B37; --usd: #E0B04A; --usd-soft: #3A2E12;
  --good: #5CC98A; --good-soft: #143523; --warn: #F0A848; --warn-soft: #3A2A12; --bad: #F2776D; --bad-soft: #3D1A17;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 24px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.55; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, a, input, select, textarea, .tile, tr.click { touch-action: manipulation; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, td.n, .n { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
td.n, th.n { text-align: left; white-space: nowrap; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 21px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* الهيكل */
.app { display: grid; grid-template-columns: 236px 1fr; height: 100%; }
.side { background: var(--surface); border-inline-start: 1px solid var(--line); overflow-y: auto; padding: 14px 10px 30px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 18px; }
.brand b { font-family: var(--display); font-size: 17px; display: block; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12px; }
.nav-sec { font-size: 11.5px; color: var(--muted); padding: 12px 10px 4px; font-weight: 600; }
.nav a { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; }
.nav a:hover { background: var(--surface2); }
.nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a .ic { width: 18px; text-align: center; opacity: .8; font-size: 13px; }
.nav a kbd { margin-inline-start: auto; font-size: 10.5px; color: var(--muted); font-family: var(--font); }
.main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 56px; }
.top .title { font-family: var(--display); font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top .sp { flex: 1; }
.burger { display: none; }
.content { flex: 1; overflow-y: auto; padding: 18px; }
.page { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* مكونات */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.card.pad0 { padding: 0; }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.card-h .sp { flex: 1; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > .f { flex: 1 1 160px; min-width: 0; }
.f label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; font-weight: 500; }
.in, select.in, textarea.in { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-height: 36px; outline: none; }
.in:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.in.n, input.n { text-align: left; direction: ltr; }
.in[readonly] { background: var(--surface2); }
.in.err { border-color: var(--bad); }
textarea.in { min-height: 60px; resize: vertical; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 8px; cursor: pointer; min-height: 36px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface2); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.bad { color: var(--bad); }
.btn.sm { padding: 3px 9px; min-height: 28px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.chip.IQD { background: var(--accent-soft); color: var(--accent); }
.chip.USD { background: var(--usd-soft); color: var(--usd); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.pos-v { color: var(--good); } .neg-v { color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; min-height: 34px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.ratechip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--usd-soft); color: var(--usd); border-radius: 99px; padding: 4px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.userchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.banner { padding: 9px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.good { background: var(--good-soft); color: var(--good); }

/* جداول */
.tbl-wrap { overflow-x: auto; border-radius: var(--r); }
table.grid { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.grid th { position: sticky; top: 0; background: var(--surface2); color: var(--muted); font-weight: 600; font-size: 12px; text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.grid tr.click { cursor: pointer; }
table.grid tr.click:hover td { background: var(--surface2); }
table.grid tr.tot td { font-weight: 700; background: var(--surface2); }
table.grid tr.grp td { font-weight: 600; }
table.grid tr.del td { text-decoration: line-through; color: var(--muted); }
table.grid td.act { white-space: nowrap; text-align: left; }
.empty { padding: 30px; text-align: center; color: var(--muted); }

/* لوحة التحكم */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi .k { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .v { font-family: var(--display); font-size: 21px; font-weight: 600; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.accent { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.quick a { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 600; font-size: 13.5px; }
.quick a:hover { border-color: var(--accent); }
.quick a span { font-size: 18px; color: var(--accent); }

/* محرر الفاتورة */
.doc-head { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.lines { display: flex; flex-direction: column; }
.ln { display: grid; grid-template-columns: 28px minmax(180px, 2.4fr) 96px 92px 120px 96px 120px 34px; gap: 6px; align-items: center; padding: 5px 8px; border-bottom: 1px solid var(--line); }
.ln.h { background: var(--surface2); font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 8px; padding-bottom: 8px; }
.ln .ix { color: var(--muted); font-size: 12px; text-align: center; }
.ln .in { min-height: 32px; padding: 5px 8px; }
.ln .tot { text-align: left; font-weight: 600; font-variant-numeric: tabular-nums; direction: ltr; }
.ln .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.ln .nm small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }
.ln.stk { grid-template-columns: 28px minmax(180px, 2.4fr) 96px 110px 110px 120px 34px; }
.ln.jl { grid-template-columns: 28px minmax(200px, 2.5fr) 90px 130px 130px minmax(120px, 1.4fr) 34px; }
.addbar { display: flex; gap: 8px; padding: 10px; background: var(--surface2); border-radius: var(--r) var(--r) 0 0; border-bottom: 1px solid var(--line); }
.addbar .in { flex: 1; }
.totals { display: grid; grid-template-columns: 1fr minmax(260px, 340px); gap: 14px; align-items: start; }
.sumbox { display: flex; flex-direction: column; gap: 6px; }
.sumbox .r { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sumbox .r .in { max-width: 150px; }
.sumbox .r.big { font-size: 18px; font-weight: 700; font-family: var(--display); border-top: 1px solid var(--line); padding-top: 8px; }
.sumbox .r .v { font-variant-numeric: tabular-nums; direction: ltr; }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 4px; }

/* القائمة المنسدلة للبحث */
.acbox { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); max-height: 320px; overflow-y: auto; min-width: 260px; }
.acbox div.o { padding: 7px 11px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
.acbox div.o:last-child { border-bottom: 0; }
.acbox div.o small { color: var(--muted); }
.acbox div.o.on { background: var(--accent-soft); }
.acbox .none { padding: 10px; color: var(--muted); font-size: 13px; }

/* النوافذ */
.modal-bg { position: fixed; inset: 0; background: rgba(8, 20, 18, .45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: min(640px, 100%); min-width: 0; max-width: 100%; max-height: calc(100% - 20px); display: flex; flex-direction: column; }
.modal.wide { width: min(980px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.modal-h h2 { flex: 1; }
.modal-b { padding: 16px; overflow-y: auto; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.toasts { position: fixed; bottom: 16px; left: 16px; z-index: 70; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13.5px; max-width: 360px; }
.toast.bad { background: var(--bad); color: #fff; } .toast.good { background: var(--good); color: #fff; }

/* الكاشير */
.pos { display: grid; grid-template-columns: 1fr 380px; gap: 14px; height: calc(100% - 4px); }
.pos .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; align-content: start; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; text-align: start; display: flex; flex-direction: column; gap: 4px; min-height: 84px; }
.tile:hover { border-color: var(--accent); }
.tile b { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.tile .p { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .q { font-size: 11.5px; color: var(--muted); }
.cart { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-height: 0; }
.cart .items { flex: 1; overflow-y: auto; min-height: 140px; }
.cart .ci { display: grid; grid-template-columns: 1fr auto; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.cart .ci .ctl { display: flex; align-items: center; gap: 4px; }
.cart .ci .ctl .in { width: 70px; min-height: 30px; padding: 3px 6px; text-align: center; }
.cart .pay { padding: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.bigtotal { font-family: var(--display); font-size: 30px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }

/* شجرة الحسابات */
.tree td.nm { padding-inline-start: calc(10px + var(--lv, 0) * 18px); }
.tree .tg { cursor: pointer; display: inline-block; width: 16px; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 150px; padding-top: 8px; }

/* طباعة/معاينة */
.pv { max-width: 100%; background: #fff; color: #111; padding: 18px; border-radius: 8px; border: 1px solid var(--line); overflow-x: auto; }

@media (max-width: 1000px) {
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .pos { grid-template-columns: 1fr; height: auto; }
  .totals { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 0 0 auto; width: 270px; z-index: 40; transform: translateX(100%); transition: transform .2s; box-shadow: var(--shadow); }
  .side.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 39; }
  .burger { display: inline-flex; }
  .top { padding: 8px 12px; }
  .content { padding: 12px; }
  .userchip .nm { display: none; }
  .ratechip .lbl { display: none; }
  .tbl-wrap table.grid { min-width: 620px; }
  .card-h h1 { font-size: 18px; }
  .ln, .ln.stk, .ln.jl { grid-template-columns: 1fr 1fr 1fr; grid-template-areas: none; row-gap: 6px; padding: 10px 8px; }
  .ln > .ix { display: none; }
  .ln > .c-item { grid-column: 1 / -1; }
  .ln > .c-del { grid-column: 3; justify-self: end; }
  .ln.h { display: none; }
  .ln .in::placeholder { color: var(--muted); }
  .ln [data-lbl]::before { content: attr(data-lbl); display: block; font-size: 11px; color: var(--muted); }
}
@media (max-width: 420px) { .kpi .v { font-size: 18px; } .top .title { font-size: 15px; } }

/* الآيفون: منع التكبير عند الكتابة، المناطق الآمنة */
@supports (-webkit-touch-callout: none) { .in, select.in, textarea.in, .ln .in, .cart .ci .ctl .in { font-size: 16px; } }
@media (max-width: 860px) { .in, select.in, textarea.in { font-size: 16px; } }
.top { padding-top: max(10px, env(safe-area-inset-top)); padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
.content { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
.side { padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
.toasts { bottom: calc(16px + env(safe-area-inset-bottom)); }
.modal-bg { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
#printroot { display: none; }
@media print {
  html.printing body > *:not(#printroot) { display: none !important; }
  html.printing #printroot { display: block !important; }
  html.printing, html.printing body { height: auto !important; overflow: visible !important; background: #fff !important; }
}

</style>

<body>
<div class="app" id="app">
  <div class="content" style="grid-column:1/-1;display:grid;place-items:center">
    <div class="card" style="max-width:420px;text-align:center">
      <div class="brand" style="justify-content:center;border:0"><div class="brand-mark">م</div><div style="text-align:start"><b>ميزان</b><small>المحاسبة والمخازن</small></div></div>
      <p id="loadmsg" class="muted">جاري تحميل الحسابات والمخازن والفواتير…</p>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script>
/* ميزان — محرك المحاسبة
 * كل المبالغ والكميات أعداد صحيحة بوحدة "الملّي" (×1000) لمنع أخطاء الكسور العشرية.
 * القيود تُشتق دائماً من المستندات الأصلية (فواتير/سندات) بإعادة البناء الكامل،
 * لذلك أي تعديل بتاريخ قديم يصحح كلفة كل ما بعده تلقائياً.
 */
(function (root) {
  'use strict';

  const CURS = ['IQD', 'USD'];
  const ONE = 1000;

  /* ───────── أدوات رقمية دقيقة ───────── */
  function toInt(x) { const n = Math.round(Number(x)); return Number.isFinite(n) ? n : 0; }

  // a*b/c مقرّب نصف للأعلى بعيداً عن الصفر، بحساب BigInt بلا فقدان دقة
  function mulDiv(a, b, c) {
    const C0 = toInt(c);
    if (C0 === 0) return 0;
    let n = BigInt(toInt(a)) * BigInt(toInt(b));
    let d = BigInt(C0);
    if (d < 0n) { n = -n; d = -d; }
    const neg = n < 0n; if (neg) n = -n;
    let q = n / d; const r = n % d;
    if (r * 2n >= d) q += 1n;
    return Number(neg ? -q : q);
  }

  // توزيع مبلغ على أوزان بطريقة الباقي الأكبر: المجموع يساوي الأصل تماماً
  function allocate(total, weights) {
    total = toInt(total);
    const n = weights.length;
    if (!n) return [];
    let w = weights.map(x => Math.max(0, toInt(x)));
    let W = w.reduce((s, x) => s + x, 0);
    if (W === 0) { w = w.map(() => 1); W = n; }
    const T = BigInt(total), Wb = BigInt(W);
    const res = new Array(n); const rems = []; let acc = 0;
    for (let i = 0; i < n; i++) {
      const p = T * BigInt(w[i]);
      const q = p / Wb; const r = p % Wb;
      res[i] = Number(q); acc += res[i];
      rems.push({ i, r: Number(r < 0n ? -r : r) });
    }
    let left = total - acc;
    rems.sort((a, b) => b.r - a.r || a.i - b.i);
    const step = left > 0 ? 1 : -1; let k = 0;
    while (left !== 0) { res[rems[k % n].i] += step; left -= step; k++; }
    return res;
  }

  function normDigits(s) {
    return String(s == null ? '' : s)
      .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
      .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0))
      .replace(/[٫]/g, '.')
      .replace(/[,٬\s_]/g, '');
  }

  // نص → ملّي (عدد صحيح). يرجع NaN إذا النص غير صالح
  function parseAmount(str) {
    let s = normDigits(str).trim();
    if (s === '') return 0;
    let neg = false;
    if (s[0] === '-' || s[0] === '−') { neg = true; s = s.slice(1); }
    if (!/^\d*\.?\d*$/.test(s) || s === '.') return NaN;
    const [ip, fp = ''] = s.split('.');
    const intPart = ip === '' ? 0 : Number(ip);
    if (!Number.isSafeInteger(intPart) || intPart > 9e11) return NaN;
    let frac = (fp + '0000').slice(0, 4);
    let milli = Number(frac.slice(0, 3));
    if (Number(frac[3]) >= 5) milli += 1;
    const v = intPart * ONE + milli;
    return neg ? -v : v;
  }

  function groupInt(str) { return str.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  // ملّي → نص منسق
  function fmt(milli, dec) {
    dec = dec == null ? 0 : Math.max(0, Math.min(3, dec));
    const v = toInt(milli);
    const neg = v < 0; const a = Math.abs(v);
    const scaled = mulDiv(a, 1, Math.pow(10, 3 - dec));
    let s = String(scaled);
    let ip = s, fp = '';
    if (dec > 0) { s = s.padStart(dec + 1, '0'); ip = s.slice(0, -dec); fp = s.slice(-dec); }
    const out = groupInt(ip) + (dec > 0 ? '.' + fp : '');
    return (neg && scaled !== 0 ? '-' : '') + out;
  }

  function toBase(amt, cur, rate100) { return cur === 'USD' ? mulDiv(amt, rate100, 100) : toInt(amt); }
  function fromBase(base, cur, rate100) { return cur === 'USD' ? mulDiv(base, 100, rate100) : toInt(base); }

  /* ───────── أنواع المستندات ───────── */
  const DOC_TYPES = {
    sale: { name: 'فاتورة مبيعات', short: 'مبيعات', inv: true },
    purchase: { name: 'فاتورة مشتريات', short: 'مشتريات', inv: true },
    sret: { name: 'مرتجع مبيعات', short: 'مرتجع بيع', inv: true },
    pret: { name: 'مرتجع مشتريات', short: 'مرتجع شراء', inv: true },
    quote: { name: 'عرض سعر / طلبية', short: 'عرض سعر', inv: true, noPost: true },
    open: { name: 'بضاعة أول المدة', short: 'أول المدة', stock: true },
    transfer: { name: 'مناقلة بين المخازن', short: 'مناقلة', stock: true },
    adjust: { name: 'جرد وتسوية مخزن', short: 'تسوية جرد', stock: true },
    receipt: { name: 'سند قبض', short: 'قبض', voucher: true },
    payment: { name: 'سند صرف', short: 'صرف', voucher: true },
    exchange: { name: 'تصريف عملة / تحويل صندوق', short: 'تصريف', voucher: true },
    journal: { name: 'قيد يومية', short: 'قيد', voucher: true },
    obal: { name: 'أرصدة افتتاحية', short: 'افتتاحي', voucher: true },
    fx: { name: 'قيد فروقات العملة', short: 'فروقات عملة', voucher: true },
  };

  // مفاتيح الحسابات النظامية المطلوبة
  const SYS_KEYS = ['inventory', 'cogs', 'sales', 'salesRet', 'salesDisc', 'openingEq', 'surplus', 'shortage',
    'damage', 'fx', 'discAllowed', 'discEarned', 'expense', 'customers', 'suppliers', 'cashIQD', 'cashUSD', 'retained'];

  /* ───────── حساب الفاتورة (نفس الدالة تستعملها الواجهة والمحرك) ───────── */
  function calcInvoice(doc) {
    const rows = (doc.lines || []).map(l => {
      const gross = mulDiv(toInt(l.qty), toInt(l.price), ONE);
      const ld = toInt(l.disc);
      return { gross, ld, net: gross - ld };
    });
    const grossTotal = rows.reduce((s, r) => s + r.gross, 0);
    const lineDisc = rows.reduce((s, r) => s + r.ld, 0);
    const sub = rows.reduce((s, r) => s + r.net, 0);
    const disc = toInt(doc.disc);
    const total = sub - disc;
    const dAlloc = allocate(disc, rows.map(r => r.net));
    rows.forEach((r, i) => { r.final = r.net - dAlloc[i]; });
    const expTotal = (doc.exp || []).reduce((s, e) => s + toInt(e.amt), 0);
    return { rows, grossTotal, lineDisc, sub, disc, total, expTotal, discAll: lineDisc + disc };
  }

  function unitFactorMilli(item, u) {
    const un = (item && item.units || [])[u || 0];
    const f = un ? Number(un.factor) : 1;
    return Math.max(1, Math.round((Number.isFinite(f) && f > 0 ? f : 1) * ONE));
  }

  function sortDocs(docs) {
    return docs.slice().sort((a, b) =>
      (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) ||
      (toInt(a.seq) - toInt(b.seq)) ||
      (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  }

  /* ───────── إعادة البناء الكامل ───────── */
  function rebuild(data, opts) {
    opts = opts || {};
    const settings = data.settings || {};
    const sys = settings.sys || {};
    const accMap = new Map((data.accounts || []).map(a => [a.id, a]));
    const itemMap = new Map((data.items || []).map(i => [i.id, i]));
    const whMap = new Map((data.warehouses || []).map(w => [w.id, w]));
    const all = (data.docs || []).filter(d => d && d.status !== 'deleted');
    const docs = sortDocs(all.filter(d => DOC_TYPES[d.type] && !DOC_TYPES[d.type].noPost));
    const upTo = opts.upTo || null;

    const S = {
      lines: [], byAcc: new Map(), entries: new Map(), moves: [], pools: new Map(), stock: new Map(),
      docRes: new Map(), lineRes: [], errors: [], warnings: [], posted: [], docIndex: new Map(),
      accMap, itemMap, whMap, sys, settings,
    };
    all.forEach(d => S.docIndex.set(d.id, d));

    const isLeaf = id => { const a = accMap.get(id); return !!a && !a.group; };
    function pool(itemId) {
      let p = S.pools.get(itemId);
      if (!p) { p = { qty: 0, value: 0, lastUnit: 0, lastBuy: 0, lastBuyCur: 'IQD', lastSale: 0 }; S.pools.set(itemId, p); }
      return p;
    }
    function stockOf(itemId, wh) { const m = S.stock.get(itemId); return m ? (m.get(wh) || 0) : 0; }
    function addStock(itemId, wh, q) {
      let m = S.stock.get(itemId); if (!m) { m = new Map(); S.stock.set(itemId, m); }
      m.set(wh, (m.get(wh) || 0) + q);
    }
    function avgUnit(p) { return p.qty > 0 && p.value > 0 ? mulDiv(p.value, ONE, p.qty) : p.lastUnit; }

    function run() {
    for (const doc of docs) {
      if (upTo && doc.date > upTo) break;
      const err = validate(doc);
      if (err) { S.errors.push({ doc: doc.id, type: doc.type, num: doc.num, date: doc.date, msg: err }); continue; }
      // نسخة احتياطية لحالة المواد قبل الترحيل (للتراجع عند خطأ داخلي)
      const touched = new Map(); const touchedStock = new Map();
      const moves0 = S.moves.length, lr0 = S.lineRes.length, w0 = S.warnings.length;
      const snapshot = id => {
        if (!touched.has(id)) touched.set(id, S.pools.has(id) ? Object.assign({}, S.pools.get(id)) : null);
        if (!touchedStock.has(id)) touchedStock.set(id, S.stock.has(id) ? new Map(S.stock.get(id)) : null);
      };
      const ctx = { doc, snapshot };
      let out;
      try {
        out = POST[doc.type](doc, ctx);
        const sum = out.lines.reduce((s, l) => s + l.base, 0);
        if (sum !== 0) throw new Error('قيد غير متوازن بمقدار ' + sum);
        for (const l of out.lines) if (!isLeaf(l.acc)) throw new Error('حساب غير صالح في القيد');
      } catch (e) {
        touched.forEach((v, k) => { if (v) S.pools.set(k, v); else S.pools.delete(k); });
        touchedStock.forEach((v, k) => { if (v) S.stock.set(k, v); else S.stock.delete(k); });
        S.moves.length = moves0; S.lineRes.length = lr0; S.warnings.length = w0;
        S.errors.push({ doc: doc.id, type: doc.type, num: doc.num, date: doc.date, msg: e.message || String(e) });
        continue;
      }
      const idxs = [];
      for (const l of out.lines) {
        if (l.amt === 0 && l.base === 0) continue;
        const rec = { doc: doc.id, date: doc.date, type: doc.type, num: doc.num, acc: l.acc, cur: l.cur, amt: l.amt, base: l.base, memo: l.memo || doc.note || '' };
        const i = S.lines.push(rec) - 1; idxs.push(i);
        let arr = S.byAcc.get(l.acc); if (!arr) { arr = []; S.byAcc.set(l.acc, arr); } arr.push(i);
      }
      S.entries.set(doc.id, idxs);
      S.posted.push(doc.id);
      if (out.res) S.docRes.set(doc.id, out.res);
    }
    }

    /* ── التحقق من صحة المستند قبل الترحيل ── */
    function validate(doc) {
      if (!doc.date || !/^\d{4}-\d{2}-\d{2}$/.test(doc.date)) return 'تاريخ غير صالح';
      const t = DOC_TYPES[doc.type];
      if (doc.cur && !CURS.includes(doc.cur)) return 'عملة غير معروفة';
      if (doc.cur === 'USD' || doc.type === 'journal' || doc.type === 'obal' || doc.type === 'receipt' || doc.type === 'payment' || doc.type === 'exchange') {
        if (!(toInt(doc.rate100) > 0)) return 'سعر الصرف غير صالح';
      }
      if (t.inv) {
        if (!doc.lines || !doc.lines.length) return 'الفاتورة بدون مواد';
        if (!whMap.has(doc.wh)) return 'المخزن غير موجود';
        for (const l of doc.lines) {
          const it = itemMap.get(l.item);
          if (!it) return 'مادة غير موجودة';
          if (!(toInt(l.qty) > 0)) return 'كمية غير صالحة للمادة ' + it.name;
          if (toInt(l.price) < 0) return 'سعر سالب للمادة ' + it.name;
          if ((it.units || []).length && !(it.units || [])[l.unit || 0]) return 'وحدة غير صالحة للمادة ' + it.name;
          if (l.wh && !whMap.has(l.wh)) return 'مخزن السطر غير موجود';
          const g = mulDiv(toInt(l.qty), toInt(l.price), ONE);
          if (toInt(l.disc) < 0 || toInt(l.disc) > g) return 'خصم السطر غير صالح للمادة ' + it.name;
        }
        const C = calcInvoice(doc);
        if (C.disc < 0 || C.disc > C.sub) return 'خصم الفاتورة غير صالح';
        const paid = toInt(doc.paid);
        if (paid < 0 || paid > C.total) return 'المبلغ الواصل أكبر من مجموع الفاتورة';
        if (doc.party) { if (!isLeaf(doc.party)) return 'حساب الزبون/المورد غير صالح'; }
        else if (paid !== C.total) return 'فاتورة نقدية بدون زبون: لازم الواصل يساوي المجموع';
        if ((paid > 0 || !doc.party) && !isLeaf(doc.cashAcc)) return 'حساب الصندوق غير صالح';
        if (doc.type === 'purchase') for (const e of (doc.exp || [])) {
          if (!isLeaf(e.acc)) return 'حساب المصروف غير صالح';
          if (toInt(e.amt) < 0) return 'مصروف سالب';
        }
        const need = doc.type === 'sale' ? ['sales', 'salesDisc', 'inventory', 'cogs'] :
          doc.type === 'sret' ? ['salesRet', 'inventory', 'cogs'] : ['inventory', 'cogs', 'expense'];
        for (const k of need) if (!isLeaf(sys[k])) return 'حساب نظامي ناقص: ' + k;
        return null;
      }
      if (doc.type === 'open' || doc.type === 'adjust' || doc.type === 'transfer') {
        if (!doc.lines || !doc.lines.length) return 'المستند بدون مواد';
        if (!whMap.has(doc.wh)) return 'المخزن غير موجود';
        if (doc.type === 'transfer') { if (!whMap.has(doc.wh2)) return 'المخزن المحوَّل إليه غير موجود'; if (doc.wh2 === doc.wh) return 'نفس المخزن'; }
        for (const l of doc.lines) {
          const it = itemMap.get(l.item); if (!it) return 'مادة غير موجودة';
          if (it.service) return 'مادة خدمية لا تدخل المخزن: ' + it.name;
          const hasCount = l.count !== undefined && l.count !== null && l.count !== '';
          if (doc.type === 'adjust') { if (!hasCount && !toInt(l.qty)) return 'كمية الجرد فارغة للمادة ' + it.name; if (hasCount && toInt(l.count) < 0) return 'كمية فعلية سالبة'; }
          else if (!(toInt(l.qty) > 0)) return 'كمية غير صالحة للمادة ' + it.name;
          if (doc.type === 'open' && toInt(l.price) < 0) return 'كلفة سالبة';
        }
        const need = doc.type === 'open' ? ['inventory', 'openingEq'] : doc.type === 'adjust' ? ['inventory', 'surplus', 'shortage', 'damage'] : [];
        for (const k of need) if (!isLeaf(sys[k])) return 'حساب نظامي ناقص: ' + k;
        return null;
      }
      if (doc.type === 'receipt' || doc.type === 'payment') {
        if (!isLeaf(doc.acc)) return 'حساب الصندوق غير صالح';
        if (!isLeaf(doc.party)) return 'الحساب المقابل غير صالح';
        if (doc.acc === doc.party) return 'نفس الحساب بالطرفين';
        const pcur = doc.pcur || doc.cur;
        if (!CURS.includes(pcur)) return 'عملة الحساب المقابل غير معروفة';
        const amt = toInt(doc.amt), d = toInt(doc.discount);
        if (amt < 0 || d < 0) return 'مبلغ سالب';
        if (amt === 0 && d === 0) return 'المبلغ صفر';
        if (pcur !== doc.cur && amt > 0 && !(toInt(doc.pamt) > 0)) return 'المبلغ المقابل بالعملة الثانية ناقص';
        if (d > 0 && !isLeaf(sys[doc.type === 'receipt' ? 'discAllowed' : 'discEarned'])) return 'حساب الخصم غير معرف';
        return null;
      }
      if (doc.type === 'exchange') {
        if (!isLeaf(doc.acc) || !isLeaf(doc.acc2)) return 'حساب غير صالح';
        if (doc.acc === doc.acc2) return 'نفس الحساب بالطرفين';
        if (!CURS.includes(doc.cur2 || doc.cur)) return 'عملة غير معروفة';
        if (!(toInt(doc.amt) > 0)) return 'المبلغ غير صالح';
        if ((doc.cur2 || doc.cur) !== doc.cur && !(toInt(doc.amt2) > 0)) return 'المبلغ المستلم غير صالح';
        return null;
      }
      if (doc.type === 'journal' || doc.type === 'obal') {
        const ls = doc.lines || [];
        if (doc.type === 'journal' && ls.length < 2) return 'القيد يحتاج سطرين على الأقل';
        if (!ls.length) return 'لا توجد أسطر';
        for (const l of ls) {
          if (!isLeaf(l.acc)) return 'حساب غير صالح في القيد';
          if (!CURS.includes(l.cur || 'IQD')) return 'عملة غير معروفة';
          if (toInt(l.dr) < 0 || toInt(l.cr) < 0) return 'مبلغ سالب في القيد';
        }
        if (doc.type === 'obal' && !isLeaf(sys.openingEq)) return 'حساب الأرصدة الافتتاحية غير معرف';
        return null;
      }
      if (doc.type === 'fx') {
        if (!isLeaf(sys.fx)) return 'حساب فروقات العملة غير معرف';
        for (const l of (doc.lines || [])) if (!isLeaf(l.acc)) return 'حساب غير صالح';
        return null;
      }
      return 'نوع مستند غير معروف';
    }

    /* ── أسطر بعملة المستند مع معالجة فرق التقريب ── */
    function docCur(list, cur, rate100) {
      const out = list.filter(l => l.amt !== 0).map(l => ({ acc: l.acc, cur, amt: l.amt, base: toBase(l.amt, cur, rate100), memo: l.memo }));
      const s = out.reduce((a, l) => a + l.base, 0);
      if (s !== 0 && out.length) {
        let k = 0; for (let i = 1; i < out.length; i++) if (Math.abs(out[i].base) > Math.abs(out[k].base)) k = i;
        out[k].base -= s;
      }
      return out;
    }
    const iqd = (acc, base, memo) => ({ acc, cur: 'IQD', amt: base, base, memo });

    /* ── عمليات المخزون ── */
    function moveRec(doc, itemId, wh, qty, value, kind) {
      S.moves.push({ doc: doc.id, date: doc.date, type: doc.type, num: doc.num, item: itemId, wh, qty, value, kind, party: doc.party || null });
    }
    function inP(ctx, itemId, wh, q, value, kind) {
      ctx.snapshot(itemId);
      const p = pool(itemId);
      p.qty += q; p.value += value;
      if (q > 0 && value >= 0) p.lastUnit = mulDiv(value, ONE, q);
      addStock(itemId, wh, q);
      moveRec(ctx.doc, itemId, wh, q, value, kind);
      let adj = 0;
      if (p.qty === 0 && p.value !== 0) { adj = -p.value; p.value = 0; }
      else if (p.qty > 0 && p.value < 0) { adj = -p.value; p.value = 0; }
      return adj; // مقدار تصحيح المخزون (+ مدين مخزون / − دائن) يقابله كلفة المبيعات
    }
    function outAvg(ctx, itemId, wh, q, kind) {
      ctx.snapshot(itemId);
      const p = pool(itemId);
      let cost;
      if (p.qty >= q && p.qty > 0) cost = mulDiv(p.value, q, p.qty);
      else {
        const avail = Math.max(p.qty, 0);
        const unit = avgUnit(p) || p.lastUnit;
        cost = (avail > 0 ? p.value : 0) + mulDiv(q - avail, unit, ONE);
        if (!unit) S.warnings.push({ doc: ctx.doc.id, item: itemId, msg: 'مادة بدون كلفة معروفة' });
      }
      p.qty -= q; p.value -= cost;
      addStock(itemId, wh, -q);
      moveRec(ctx.doc, itemId, wh, -q, -cost, kind);
      if (stockOf(itemId, wh) < 0) S.warnings.push({ doc: ctx.doc.id, item: itemId, wh, msg: 'رصيد المادة صار سالباً بالمخزن' });
      return cost;
    }
    function outVal(ctx, itemId, wh, q, value, kind) {
      ctx.snapshot(itemId);
      const p = pool(itemId);
      p.qty -= q; p.value -= value;
      addStock(itemId, wh, -q);
      moveRec(ctx.doc, itemId, wh, -q, -value, kind);
      if (stockOf(itemId, wh) < 0) S.warnings.push({ doc: ctx.doc.id, item: itemId, wh, msg: 'رصيد المادة صار سالباً بالمخزن' });
      let adj = 0;
      if (p.qty === 0 && p.value !== 0) { adj = -p.value; p.value = 0; }
      else if (p.qty > 0 && p.value < 0) { adj = -p.value; p.value = 0; }
      else if (p.qty < 0 && p.value > 0) { adj = -p.value; p.value = 0; }
      return adj;
    }
    function transferQty(ctx, itemId, from, to, q) {
      ctx.snapshot(itemId);
      addStock(itemId, from, -q); addStock(itemId, to, q);
      moveRec(ctx.doc, itemId, from, -q, 0, 'out'); moveRec(ctx.doc, itemId, to, q, 0, 'in');
      if (stockOf(itemId, from) < 0) S.warnings.push({ doc: ctx.doc.id, item: itemId, wh: from, msg: 'رصيد المادة صار سالباً بالمخزن' });
    }

    /* ── مرحّلات المستندات ── */
    const POST = {
      sale(doc, ctx) {
        const C = calcInvoice(doc); const rate = toInt(doc.rate100) || 100; const cur = doc.cur || 'IQD';
        const paid = toInt(doc.paid); const debtor = doc.party || doc.cashAcc;
        const L = [{ acc: debtor, amt: C.total }];
        if (C.discAll) L.push({ acc: sys.salesDisc, amt: C.discAll });
        L.push({ acc: sys.sales, amt: -C.grossTotal });
        if (doc.party && paid > 0) { L.push({ acc: doc.cashAcc, amt: paid, memo: 'واصل' }); L.push({ acc: doc.party, amt: -paid, memo: 'واصل' }); }
        const lines = docCur(L, cur, rate);
        const finalsBase = allocate(toBase(C.total, cur, rate), C.rows.map(r => r.final));
        let costSum = 0, adjSum = 0; const lineCost = [];
        doc.lines.forEach((l, i) => {
          const it = itemMap.get(l.item); const wh = l.wh || doc.wh;
          const bq = mulDiv(toInt(l.qty), unitFactorMilli(it, l.unit), ONE);
          let cost = 0;
          if (!it.service) { cost = outAvg(ctx, l.item, wh, bq, 'sale'); costSum += cost; }
          const p = pool(l.item); if (bq > 0) p.lastSale = mulDiv(toBase(C.rows[i].final, cur, rate), ONE, bq);
          lineCost.push(cost);
          S.lineRes.push({ doc: doc.id, date: doc.date, type: 'sale', item: l.item, party: doc.party || null, rep: doc.rep || null, wh, bq, rev: finalsBase[i], cost, sign: 1 });
        });
        if (costSum) { lines.push(iqd(sys.cogs, costSum, 'كلفة المبيعات')); lines.push(iqd(sys.inventory, -costSum, 'كلفة المبيعات')); }
        const rev = toBase(C.total, cur, rate);
        return { lines, res: { total: C.total, paid, cur, base: rev, cost: costSum, profit: rev - costSum, lineCost, adj: adjSum } };
      },
      purchase(doc, ctx) {
        const C = calcInvoice(doc); const rate = toInt(doc.rate100) || 100; const cur = doc.cur || 'IQD';
        const paid = toInt(doc.paid); const creditor = doc.party || doc.cashAcc;
        const expAlloc = allocate(C.expTotal, C.rows.map(r => r.final));
        const vals = C.rows.map((r, i) => r.final + expAlloc[i]);
        let stockVal = 0, servVal = 0;
        doc.lines.forEach((l, i) => { if (itemMap.get(l.item).service) servVal += vals[i]; else stockVal += vals[i]; });
        const L = [];
        if (stockVal) L.push({ acc: sys.inventory, amt: stockVal, memo: 'مشتريات' });
        if (servVal) L.push({ acc: sys.expense, amt: servVal, memo: 'مشتريات خدمية' });
        L.push({ acc: creditor, amt: -C.total });
        (doc.exp || []).forEach(e => L.push({ acc: e.acc, amt: -toInt(e.amt), memo: e.note || 'مصاريف شراء' }));
        if (doc.party && paid > 0) { L.push({ acc: doc.party, amt: paid, memo: 'مدفوع' }); L.push({ acc: doc.cashAcc, amt: -paid, memo: 'مدفوع' }); }
        const lines = docCur(L, cur, rate);
        const invLine = lines.find(x => x.acc === sys.inventory);
        const invBase = invLine ? invLine.base : 0;
        const stockIdx = []; doc.lines.forEach((l, i) => { if (!itemMap.get(l.item).service) stockIdx.push(i); });
        const baseVals = allocate(invBase, stockIdx.map(i => vals[i]));
        let adjSum = 0;
        stockIdx.forEach((i, k) => {
          const l = doc.lines[i]; const it = itemMap.get(l.item); const wh = l.wh || doc.wh;
          const bq = mulDiv(toInt(l.qty), unitFactorMilli(it, l.unit), ONE);
          adjSum += inP(ctx, l.item, wh, bq, baseVals[k], 'purchase');
          const p = pool(l.item); p.lastBuy = mulDiv(vals[i], ONE, bq); p.lastBuyCur = cur;
        });
        if (adjSum) { lines.push(iqd(sys.inventory, adjSum, 'تسوية كلفة')); lines.push(iqd(sys.cogs, -adjSum, 'تسوية كلفة')); }
        return { lines, res: { total: C.total, paid, cur, base: toBase(C.total, cur, rate), exp: C.expTotal } };
      },
      sret(doc, ctx) {
        const C = calcInvoice(doc); const rate = toInt(doc.rate100) || 100; const cur = doc.cur || 'IQD';
        const paid = toInt(doc.paid); const party = doc.party || doc.cashAcc;
        const L = [{ acc: sys.salesRet, amt: C.total }, { acc: party, amt: -C.total }];
        if (doc.party && paid > 0) { L.push({ acc: doc.party, amt: paid, memo: 'مردود نقداً' }); L.push({ acc: doc.cashAcc, amt: -paid, memo: 'مردود نقداً' }); }
        const lines = docCur(L, cur, rate);
        const finalsBase = allocate(toBase(C.total, cur, rate), C.rows.map(r => r.final));
        const ref = doc.ref ? S.docIndex.get(doc.ref) : null;
        const refRes = ref ? S.docRes.get(ref.id) : null;
        let costSum = 0, adjSum = 0;
        doc.lines.forEach((l, i) => {
          const it = itemMap.get(l.item); const wh = l.wh || doc.wh;
          const bq = mulDiv(toInt(l.qty), unitFactorMilli(it, l.unit), ONE);
          let value = 0;
          if (!it.service) {
            let unit = null;
            if (ref && refRes && refRes.lineCost) {
              const j = ref.lines.findIndex(x => x.item === l.item);
              if (j >= 0) { const rl = ref.lines[j]; const rbq = mulDiv(toInt(rl.qty), unitFactorMilli(it, rl.unit), ONE); if (rbq > 0) unit = mulDiv(refRes.lineCost[j], ONE, rbq); }
            }
            if (unit == null) unit = avgUnit(pool(l.item));
            value = mulDiv(bq, unit, ONE);
            adjSum += inP(ctx, l.item, wh, bq, value, 'sret');
            costSum += value;
          }
          S.lineRes.push({ doc: doc.id, date: doc.date, type: 'sret', item: l.item, party: doc.party || null, rep: doc.rep || null, wh, bq: -bq, rev: -finalsBase[i], cost: -value, sign: -1 });
        });
        if (costSum) { lines.push(iqd(sys.inventory, costSum, 'إرجاع للمخزن')); lines.push(iqd(sys.cogs, -costSum, 'إرجاع للمخزن')); }
        if (adjSum) { lines.push(iqd(sys.inventory, adjSum, 'تسوية كلفة')); lines.push(iqd(sys.cogs, -adjSum, 'تسوية كلفة')); }
        const rev = toBase(C.total, cur, rate);
        return { lines, res: { total: C.total, paid, cur, base: rev, cost: costSum, profit: -(rev - costSum) } };
      },
      pret(doc, ctx) {
        const C = calcInvoice(doc); const rate = toInt(doc.rate100) || 100; const cur = doc.cur || 'IQD';
        const paid = toInt(doc.paid); const party = doc.party || doc.cashAcc;
        let stockVal = 0, servVal = 0;
        doc.lines.forEach((l, i) => { if (itemMap.get(l.item).service) servVal += C.rows[i].final; else stockVal += C.rows[i].final; });
        const L = [{ acc: party, amt: C.total }];
        if (stockVal) L.push({ acc: sys.inventory, amt: -stockVal, memo: 'مرتجع مشتريات' });
        if (servVal) L.push({ acc: sys.expense, amt: -servVal, memo: 'مرتجع خدمات' });
        if (doc.party && paid > 0) { L.push({ acc: doc.cashAcc, amt: paid, memo: 'مستلم' }); L.push({ acc: doc.party, amt: -paid, memo: 'مستلم' }); }
        const lines = docCur(L, cur, rate);
        const invLine = lines.find(x => x.acc === sys.inventory);
        const invBase = invLine ? -invLine.base : 0;
        const stockIdx = []; doc.lines.forEach((l, i) => { if (!itemMap.get(l.item).service) stockIdx.push(i); });
        const baseVals = allocate(invBase, stockIdx.map(i => C.rows[i].final));
        let adjSum = 0;
        stockIdx.forEach((i, k) => {
          const l = doc.lines[i]; const it = itemMap.get(l.item); const wh = l.wh || doc.wh;
          const bq = mulDiv(toInt(l.qty), unitFactorMilli(it, l.unit), ONE);
          adjSum += outVal(ctx, l.item, wh, bq, baseVals[k], 'pret');
        });
        if (adjSum) { lines.push(iqd(sys.inventory, adjSum, 'تسوية كلفة')); lines.push(iqd(sys.cogs, -adjSum, 'تسوية كلفة')); }
        return { lines, res: { total: C.total, paid, cur, base: toBase(C.total, cur, rate) } };
      },
      open(doc, ctx) {
        const rate = toInt(doc.rate100) || 100; const cur = doc.cur || 'IQD';
        const vals = doc.lines.map(l => mulDiv(toInt(l.qty), toInt(l.price), ONE));
        const tot = vals.reduce((s, v) => s + v, 0);
        const lines = docCur([{ acc: sys.inventory, amt: tot }, { acc: sys.openingEq, amt: -tot }], cur, rate);
        const invLine = lines.find(x => x.acc === sys.inventory);
        const baseVals = allocate(invLine ? invLine.base : 0, vals);
        let adjSum = 0;
        doc.lines.forEach((l, i) => {
          const it = itemMap.get(l.item); const bq = mulDiv(toInt(l.qty), unitFactorMilli(it, l.unit), ONE);
          adjSum += inP(ctx, l.item, l.wh || doc.wh, bq, baseVals[i], 'open');
        });
        if (adjSum) { lines.push(iqd(sys.inventory, adjSum, 'تسوية كلفة')); lines.push(iqd(sys.cogs, -adjSum, 'تسوية كلفة')); }
        return { lines, res: { total: tot, cur, base: invLine ? invLine.base : 0 } };
      },
      transfer(doc, ctx) {
        doc.lines.forEach(l => {
          const it = itemMap.get(l.item); const bq = mulDiv(toInt(l.qty), unitFactorMilli(it, l.unit), ONE);
          transferQty(ctx, l.item, doc.wh, doc.wh2, bq);
        });
        return { lines: [], res: { total: 0, cur: 'IQD', base: 0 } };
      },
      adjust(doc, ctx) {
        let plus = 0, minus = 0, adjSum = 0; const deltas = [];
        const lossAcc = doc.reason === 'damage' ? sys.damage : sys.shortage;
        doc.lines.forEach(l => {
          const it = itemMap.get(l.item); const wh = l.wh || doc.wh; const f = unitFactorMilli(it, l.unit);
          const hasCount = l.count !== undefined && l.count !== null && l.count !== '';
          const delta = hasCount ? mulDiv(toInt(l.count), f, ONE) - stockOf(l.item, wh) : mulDiv(toInt(l.qty), f, ONE);
          deltas.push(delta);
          if (delta > 0) {
            const unit = avgUnit(pool(l.item)); const v = mulDiv(delta, unit, ONE);
            adjSum += inP(ctx, l.item, wh, delta, v, 'adjust'); plus += v;
          } else if (delta < 0) {
            minus += outAvg(ctx, l.item, wh, -delta, 'adjust');
          }
        });
        const lines = [];
        if (plus) { lines.push(iqd(sys.inventory, plus, 'فائض جرد')); lines.push(iqd(sys.surplus, -plus, 'فائض جرد')); }
        if (minus) { lines.push(iqd(lossAcc, minus, doc.reason === 'damage' ? 'تلف' : 'عجز جرد')); lines.push(iqd(sys.inventory, -minus, doc.reason === 'damage' ? 'تلف' : 'عجز جرد')); }
        if (adjSum) { lines.push(iqd(sys.inventory, adjSum, 'تسوية كلفة')); lines.push(iqd(sys.cogs, -adjSum, 'تسوية كلفة')); }
        return { lines, res: { total: plus - minus, cur: 'IQD', base: plus - minus, deltas } };
      },
      receipt(doc) { return voucher(doc, 1); },
      payment(doc) { return voucher(doc, -1); },
      exchange(doc) {
        const rate = toInt(doc.rate100); const cur = doc.cur, cur2 = doc.cur2 || doc.cur;
        const amt = toInt(doc.amt); const amt2 = cur2 === cur ? amt : toInt(doc.amt2);
        const base = cur === 'IQD' ? amt : cur2 === 'IQD' ? amt2 : toBase(amt, cur, rate);
        return {
          lines: [{ acc: doc.acc2, cur: cur2, amt: amt2, base, memo: doc.note || 'تصريف' }, { acc: doc.acc, cur, amt: -amt, base: -base, memo: doc.note || 'تصريف' }],
          res: { total: amt, cur, base },
        };
      },
      journal(doc) {
        const rate = toInt(doc.rate100);
        const ls = doc.lines.map(l => {
          const cur = l.cur || 'IQD'; const amt = toInt(l.dr) - toInt(l.cr);
          return { acc: l.acc, cur, amt, base: toBase(amt, cur, rate), memo: l.note || doc.note || '' };
        });
        const curs = new Set(ls.map(l => l.cur));
        if (curs.size === 1 && ls.reduce((s, l) => s + l.amt, 0) !== 0) throw new Error('القيد غير متوازن: المدين لا يساوي الدائن');
        const s = ls.reduce((a, l) => a + l.base, 0);
        if (s !== 0) {
          if (Math.abs(s) > ONE) throw new Error('القيد غير متوازن بالدينار بمقدار ' + fmt(s, 0));
          let k = 0; for (let i = 1; i < ls.length; i++) if (Math.abs(ls[i].base) > Math.abs(ls[k].base)) k = i;
          ls[k].base -= s;
        }
        const dr = ls.reduce((a, l) => a + Math.max(l.base, 0), 0);

      },
      obal(doc) {
        const rate = toInt(doc.rate100); const lines = []; const sums = {};
        doc.lines.forEach(l => {
          const cur = l.cur || 'IQD'; const amt = toInt(l.dr) - toInt(l.cr); if (!amt) return;
          const base = toBase(amt, cur, rate);
          lines.push({ acc: l.acc, cur, amt, base, memo: l.note || 'رصيد افتتاحي' });

        });
        // حقوق الملكية بند غير نقدي: يُسجل مقابلها بالدينار فقط
        const tb = Object.keys(sums).reduce((a, cur) => a + sums[cur].base, 0);
        if (tb) lines.push({ acc: sys.openingEq, cur: 'IQD', amt: -tb, base: -tb, memo: 'أرصدة افتتاحية' });
        return { lines, res: { total: 0, cur: 'IQD', base: 0 } };
      },
      fx(doc) {
        const lines = []; let s = 0;
        (doc.lines || []).forEach(l => { const b = toInt(l.base); if (!b) return; lines.push({ acc: l.acc, cur: 'USD', amt: 0, base: b, memo: 'فروقات تقييم العملة' }); s += b; });
        if (s) lines.push({ acc: sys.fx, cur: 'IQD', amt: -s, base: -s, memo: 'فروقات تقييم العملة' });
        return { lines, res: { total: s, cur: 'IQD', base: s } };
      },
    };

    function voucher(doc, dir) {
      const rate = toInt(doc.rate100); const cur = doc.cur; const pcur = doc.pcur || cur;
      const amt = toInt(doc.amt); const d = toInt(doc.discount);
      const pamt = pcur === cur ? amt : toInt(doc.pamt);
      const base = cur === pcur ? toBase(amt, cur, rate) : (cur === 'IQD' ? amt : pcur === 'IQD' ? pamt : toBase(amt, cur, rate));
      const memo = doc.note || (dir > 0 ? 'سند قبض' : 'سند صرف');
      const lines = [];
      if (amt) { lines.push({ acc: doc.acc, cur, amt: dir * amt, base: dir * base, memo }); lines.push({ acc: doc.party, cur: pcur, amt: -dir * pamt, base: -dir * base, memo }); }
      if (d) {
        const db = toBase(d, pcur, rate);
        const dAcc = dir > 0 ? sys.discAllowed : sys.discEarned;
        lines.push({ acc: dAcc, cur: pcur, amt: dir * d, base: dir * db, memo: dir > 0 ? 'خصم مسموح به' : 'خصم مكتسب' });
        lines.push({ acc: doc.party, cur: pcur, amt: -dir * d, base: -dir * db, memo: dir > 0 ? 'خصم مسموح به' : 'خصم مكتسب' });
      }

    }

    run();
    return S;
  }

  /* ───────── أدوات التقارير ───────── */
  function childrenMap(accounts) {
    const m = new Map();
    accounts.forEach(a => { const p = a.parent || ''; if (!m.has(p)) m.set(p, []); m.get(p).push(a); });
    m.forEach(arr => arr.sort((x, y) => String(x.code).localeCompare(String(y.code), 'en', { numeric: true })));
    return m;
  }
  function descendants(accounts, id) {
    const cm = childrenMap(accounts); const out = new Set([id]); const st = [id];
    while (st.length) { const x = st.pop(); (cm.get(x) || []).forEach(c => { if (!out.has(c.id)) { out.add(c.id); st.push(c.id); } }); }
    return out;
  }

  // الرصيد: base = بالدينار المكافئ، IQD/USD = أرصدة كل عملة
  function balances(S, opts) {
    opts = opts || {}; const from = opts.from || '', to = opts.to || '9999';
    const out = new Map();
    for (const l of S.lines) {
      if (l.date > to) continue;
      let b = out.get(l.acc); if (!b) { b = { open: 0, dr: 0, cr: 0, base: 0, IQD: 0, USD: 0, usdBase: 0 }; out.set(l.acc, b); }
      if (l.date < from) b.open += l.base; else if (l.base > 0) b.dr += l.base; else b.cr -= l.base;
      b.base += l.base; b[l.cur] += l.amt; if (l.cur === 'USD') b.usdBase += l.base;
    }
    return out;
  }

  function rollup(accounts, bal) {
    const cm = childrenMap(accounts); const res = new Map();
    const z = () => ({ open: 0, dr: 0, cr: 0, base: 0, IQD: 0, USD: 0, usdBase: 0 });
    function walk(a) {
      const own = bal.get(a.id); const r = z();
      if (own) Object.keys(r).forEach(k => { r[k] += own[k]; });
      (cm.get(a.id) || []).forEach(c => { const cr = walk(c); Object.keys(r).forEach(k => { r[k] += cr[k]; }); });
      res.set(a.id, r); return r;
    }
    (cm.get('') || []).forEach(walk);
    return res;
  }

  function statement(S, accIds, opts) {
    opts = opts || {}; const from = opts.from || '', to = opts.to || '9999'; const mode = opts.cur || 'base';
    const ids = accIds instanceof Set ? accIds : new Set([].concat(accIds));
    let open = 0; const rows = [];
    const idxs = [];
    ids.forEach(id => { (S.byAcc.get(id) || []).forEach(i => idxs.push(i)); });
    idxs.sort((a, b) => a - b);
    let bal = 0, dr = 0, cr = 0;
    for (const i of idxs) {
      const l = S.lines[i];
      if (mode !== 'base' && l.cur !== mode) continue;
      const v = mode === 'base' ? l.base : l.amt;
      if (l.date > to) continue;
      if (l.date < from) { open += v; continue; }
      if (v === 0) continue;
      if (!rows.length) bal = open;
      bal += v; if (v > 0) dr += v; else cr -= v;
      rows.push({ i, date: l.date, doc: l.doc, type: l.type, num: l.num, acc: l.acc, memo: l.memo, cur: l.cur, amt: l.amt, dr: v > 0 ? v : 0, cr: v < 0 ? -v : 0, bal });
    }
    return { open, rows, dr, cr, close: open + dr - cr };
  }

  function natureSign(n) { return (n === 'A' || n === 'X') ? 1 : -1; }

  function incomeStatement(S, accounts, from, to) {
    const bal = balances(S, { from, to });
    const sum = pred => accounts.filter(a => !a.group && pred(a)).reduce((s, a) => { const b = bal.get(a.id); return s + (b ? (b.dr - b.cr) : 0); }, 0);
    const sys = S.sys;
    const byNature = n => accounts.filter(a => !a.group && a.nature === n);
    const sales = -sum(a => a.id === sys.sales);
    const ret = sum(a => a.id === sys.salesRet);
    const disc = sum(a => a.id === sys.salesDisc);
    const netSales = sales - ret - disc;
    const cogs = sum(a => a.id === sys.cogs);
    const gross = netSales - cogs;
    const special = new Set([sys.sales, sys.salesRet, sys.salesDisc, sys.cogs]);
    const otherRev = byNature('R').filter(a => !special.has(a.id)).map(a => { const b = bal.get(a.id); return { acc: a, v: b ? (b.cr - b.dr) : 0 }; }).filter(x => x.v);
    const exps = byNature('X').filter(a => !special.has(a.id)).map(a => { const b = bal.get(a.id); return { acc: a, v: b ? (b.dr - b.cr) : 0 }; }).filter(x => x.v);
    const otherRevT = otherRev.reduce((s, x) => s + x.v, 0); const expT = exps.reduce((s, x) => s + x.v, 0);
    return { sales, ret, disc, netSales, cogs, gross, otherRev, otherRevT, exps, expT, net: gross + otherRevT - expT };
  }

  function balanceSheet(S, accounts, asOf) {
    const bal = balances(S, { to: asOf });
    const roll = rollup(accounts, bal);
    const sec = n => accounts.filter(a => !a.group && a.nature === n).map(a => { const b = bal.get(a.id); return { acc: a, v: b ? b.base * natureSign(n) : 0 }; }).filter(x => x.v);
    const A = sec('A'), L = sec('L'), E = sec('E');
    const tot = arr => arr.reduce((s, x) => s + x.v, 0);
    let earnings = 0;
    accounts.forEach(a => { if (!a.group && (a.nature === 'R' || a.nature === 'X')) { const b = bal.get(a.id); if (b) earnings -= b.base; } });
    const tA = tot(A), tL = tot(L), tE = tot(E) + earnings;
    return { A, L, E, earnings, tA, tL, tE, diff: tA - tL - tE, roll };
  }

  function stockAt(S, asOf) {
    const q = new Map(); const v = new Map();
    for (const m of S.moves) {
      if (asOf && m.date > asOf) continue;
      const k = m.item; if (!q.has(k)) q.set(k, new Map());
      q.get(k).set(m.wh, (q.get(k).get(m.wh) || 0) + m.qty);
      v.set(k, (v.get(k) || 0) + m.value);
    }
    return { qty: q, value: v };
  }

  function itemCard(S, itemId, opts) {
    opts = opts || {}; const from = opts.from || '', to = opts.to || '9999', wh = opts.wh || null;
    let open = 0, openV = 0, bal = 0, balV = 0; const rows = [];
    for (const m of S.moves) {
      if (m.item !== itemId || (wh && m.wh !== wh)) continue;
      if (m.date > to) continue;
      if (m.date < from) { open += m.qty; openV += m.value; continue; }
      if (!rows.length) { bal = open; balV = openV; }
      bal += m.qty; balV += m.value;
      rows.push(Object.assign({}, m, { bal, balV }));
    }
    return { open, openV, rows, close: rows.length ? bal : open };
  }

  // أعمار الديون بطريقة الوارد أولاً: التسديدات تطفئ أقدم الديون
  function aging(S, accId, cur, asOf, buckets) {
    buckets = buckets || [30, 60, 90];
    const st = statement(S, accId, { cur, to: asOf || '9999' });
    const sgn = Math.sign(st.close) || 1;
    const items = []; let credit = 0;
    if (st.open) { if (st.open * sgn > 0) items.push({ date: '0000-00-00', amt: st.open * sgn }); else credit += -st.open * sgn; }
    st.rows.forEach(r => { const v = (r.dr - r.cr) * sgn; if (v > 0) items.push({ date: r.date, amt: v }); else credit += -v; });
    for (const it of items) { const use = Math.min(it.amt, credit); it.amt -= use; credit -= use; if (!credit) break; }
    const ref = asOf ? new Date(asOf + 'T00:00:00Z') : new Date();
    const res = new Array(buckets.length + 1).fill(0);
    items.forEach(it => {
      if (!it.amt) return;
      const days = it.date === '0000-00-00' ? 99999 : Math.floor((ref - new Date(it.date + 'T00:00:00Z')) / 86400000);
      let k = buckets.findIndex(b => days <= b); if (k < 0) k = buckets.length;

    /* الحفظ */
    function buildDoc() {

    async function save(print) {

      const d = buildDoc();

      const ck = A.checkDoc(d);
      if (ck.error) { toast(ck.error, 'bad'); return; }
      if (ck.neg && ck.neg.length && !st().allowNegative && (t === 'sale' || t === 'pret')) {

        return;
      }
      if (ck.neg && ck.neg.length && st().allowNegative && (t === 'sale' || t === 'pret')) toast('تنبيه: بعض المواد صار رصيدها سالب', 'bad');
      if (t === 'sale' && d.party) {

        }

      A.dirty = false;

      toast(`انحفظت ${T[t].name} رقم ${saved.num}`, 'good');
      if (print) A.printDoc(saved.id, ck.S);

        ${[0, 1, 2].map(k => `<tr data-prow="${k}"><td class="small">${esc(it.units[k].name || ['صغرى', 'ثانية', 'ثالثة'][k])}</td>${lv.map((x, j) => `<td style="min-width:96px"><input class="in n" data-pr="${k}-${j}" inputmode="decimal" value="${amtIn(((it.prices || [])[k] || [])[j], it.cur)}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>

      title: 'تغيير أسعار جماعي',
      body: `<div class="row"><div class="f"><label for="bp-g">المجموعة</label><select class="in" id="bp-g"><option value="">كل المواد</option>${A.data.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div>

        <div class="row"><div class="f"><label for="bp-p">نسبة التغيير % (سالب للتخفيض)</label><input class="in n" id="bp-p" inputmode="decimal" placeholder="مثلاً 10 أو -5"></div>
        <div class="f"><label for="bp-r">تقريب إلى أقرب (دينار)</label><select class="in" id="bp-r"><option value="0">بدون</option><option value="50">50</option><option value="250" selected>250</option><option value="500">500</option><option value="1000">1000</option></select></div></div>`,
      actions: [{ label: 'إلغاء' }, {
        label: 'طبّق', cls: 'pri', onClick: async bg => {

          const g = $('#bp-g', bg).value, l = $('#bp-l', bg).value, rnd = +$('#bp-r', bg).value * 1000;

          for (const it of list) {
            const prices = (it.prices || []).map(row => row.map((v, j) => {
              if (!v || (l !== 'all' && +l !== j)) return v;

              return nv;
            }));
            await write('items/' + it.id, Object.assign({}, it, { prices }));
          }
          toast('تحدثت الأسعار', 'good');
        },
      }],
    });

  function partyList(kind) {

        const sg = isC ? 1 : -1; let tI = 0, tU = 0;

        }).join('');
        el.innerHTML = `<div class="page"><div class="card"><div class="card-h"><h1>${isC ? 'الزبائن' : 'الموردون'}</h1><span class="chip">${list.length}</span><span class="sp"></span>
          ${can('master') || (isC && can('sell')) ? `<button class="btn pri" id="pl-add">＋ ${isC ? 'زبون' : 'مورد'} جديد</button>` : ''}</div>
          <div class="row"><div class="f"><input class="in" id="pl-q" placeholder="بحث بالاسم أو الهاتف" value="${esc(f.q)}"></div>
          ${(st().areas || []).length ? `<div class="f" style="flex:0 0 180px"><select class="in" id="pl-area"><option value="">كل المناطق</option>${st().areas.map(x => `<option ${f.area === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>` : ''}
          <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="pl-debt" ${f.debt ? 'checked' : ''}> اللي عليهم رصيد فقط</label><button class="btn" id="pl-csv">تصدير Excel</button></div></div>
          <div class="kpis"><div class="kpi"><span class="k">${isC ? 'مجموع ديوننا على الزبائن' : 'مجموع ديون الموردين علينا'} بالدينار</span><span class="v n">${money(sg * tI)}</span></div><div class="kpi"><span class="k">بالدولار</span><span class="v n">${money(sg * tU, 'USD')}</span></div></div>

    ctx.filt.innerHTML = `<div class="row">${defs.map(d => {
      const v = rs[d.k] != null ? rs[d.k] : d.def; if (rs[d.k] == null) rs[d.k] = d.def;
      if (d.type === 'date') return `<div class="f" style="flex:0 1 160px"><label for="rf-${d.k}">${d.l}</label><input class="in" type="date" id="rf-${d.k}" value="${esc(v || '')}"></div>`;
      if (d.type === 'sel') return `<div class="f" style="flex:0 1 ${d.w || 190}px"><label for="rf-${d.k}">${d.l}</label><select class="in" id="rf-${d.k}">${d.opts.map(([ov, on]) => `<option value="${esc(ov)}" ${String(v) === String(ov) ? 'selected' : ''}>${esc(on)}</option>`).join('')}</select></div>`;
      if (d.type === 'acc' || d.type === 'item') return `<div class="f" style="flex:1 1 260px"><label for="rf-${d.k}">${d.l}</label><input class="in" id="rf-${d.k}" data-id="${esc(v || '')}" placeholder="ابحث…"></div>`;
      if (d.type === 'num') return `<div class="f" style="flex:0 1 140px"><label for="rf-${d.k}">${d.l}</label><input class="in n" id="rf-${d.k}" inputmode="decimal" value="${esc(v)}"></div>`;
      return '';
    }).join('')}</div>`;
    defs.forEach(d => {
      const inp = $('#rf-' + d.k, ctx.filt); if (!inp) return;
      if (d.type === 'acc') A.accPicker(inp, d.pred || null, id => { rs[d.k] = id; onChange(); });
      else if (d.type === 'item') { inp.value = rs[d.k] ? ((A.item(rs[d.k]) || {}).name || '') : ''; A.bindAC(inp, q => A.SRC.items(q), o => { inp.value = o.label; inp.dataset.id = o.id; rs[d.k] = o.id; onChange(); }); }
      else inp.onchange = () => { rs[d.k] = d.type === 'num' ? inp.value : inp.value; onChange(); };
    });
  }
  const table = (head, rows, foot) => `<div class="card pad0"><div class="tbl-wrap"><table class="grid"><thead><tr>${head.map(h => `<th class="${h[1] || ''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.join('') || `<tr><td colspan="${head.length}" class="empty">ماكو بيانات بهذي الفترة</td></tr>`}</tbody>${foot ? `<tfoot>${foot}</tfoot>` : ''}</table></div></div>`;
  const docLink = (r) => `<a href="#" style="white-space:nowrap" data-doc="${r.doc}">${esc(T[r.type] ? T[r.type].short : r.type)} ${esc(r.num || '')}</a>`;
  function bindDocs(ctx) { $$('[data-doc]', ctx.out).forEach(a => a.onclick = e => { e.preventDefault(); A.openDoc(a.dataset.doc); }); }
  const whOpts = () => [['', 'كل المخازن']].concat(A.data.warehouses.map(w => [w.id, w.name]));
  const grpOpts = () => [['', 'كل المجموعات']].concat(A.data.groups.map(g => [g.id, g.name]));
  // نص سطر الحركة
  function lineDesc(r) {
    const d = A.data.docs.get(r.doc); let s = T[r.type] ? T[r.type].name : '';
    const m = (r.memo || '').trim();
    if (m && !s.includes(m) && !m.includes(s) && m !== 'سند قبض' && m !== 'سند صرف') s += ' — ' + m;
    return s;
  }

  const RENDER = {
    /* كشف حساب */
    statement(ctx) {
      const rs = ctx.rs;
      const draw = () => {
        const id = rs.acc; if (!id) { ctx.out.innerHTML = '<div class="card empty">اختر حساب</div>'; return; }
        const a = A.acc(id); const ids = a && a.group ? E.descendants(A.data.accounts, id) : new Set([id]);
        const modes = rs.cur === 'both' ? ['IQD', 'USD'] : [rs.cur];
        const sg = a && (a.nature === 'L' || a.nature === 'E' || a.nature === 'R') ? -1 : 1;
        const blocks = []; const csvRows = [['التاريخ', 'المستند', 'البيان', 'العملة', 'مدين', 'دائن', 'الرصيد']]; const txt = [];
        txt.push('كشف حساب: ' + (a ? a.name : '')); txt.push('من ' + (rs.from || 'البداية') + ' إلى ' + rs.to); txt.push('');
        modes.forEach(m => {
          const S = E.statement(A.S, ids, { from: rs.from, to: rs.to, cur: m });
          if (rs.cur === 'both' && !S.rows.length && !S.open) return;
          const c = m === 'base' ? 'IQD' : m;
          const lbl = m === 'base' ? 'بالدينار المكافئ (كل العملات)' : 'بال' + CUR_NAME[m];
          const rows = [`<tr class="grp"><td colspan="3">رصيد سابق</td><td></td><td></td><td class="n">${money(sg * S.open, c)}</td></tr>`].concat(S.rows.map(r => `<tr><td class="n">${esc(r.date)}</td><td>${docLink(r)}</td><td class="small">${esc(lineDesc(r))}${a && a.group ? '<br><span class="muted">' + esc(A.accName(r.acc)) + '</span>' : ''}${m === 'base' && r.cur === 'USD' ? ' <span class="chip USD">$ ' + money(r.amt, 'USD') + '</span>' : ''}</td><td class="n">${r.dr ? money(r.dr, c) : ''}</td><td class="n">${r.cr ? money(r.cr, c) : ''}</td><td class="n ${signCls(sg * r.bal)}">${money(sg * r.bal, c)}</td></tr>`));
          const foot = `<tr class="tot"><td colspan="3">المجموع</td><td class="n">${money(S.dr, c)}</td><td class="n">${money(S.cr, c)}</td><td class="n">${money(sg * S.close, c)}</td></tr>`;
          blocks.push(`<div class="card-h" style="margin-top:6px"><h2>${lbl}</h2><span class="sp"></span><span class="chip ${c}">الرصيد ${money(sg * S.close, c)} ${CUR_LBL[c]}</span></div>` + table([['التاريخ'], ['المستند'], ['البيان'], ['مدين', 'n'], ['دائن', 'n'], ['الرصيد', 'n']], rows, foot));
          csvRows.push(['', 'رصيد سابق', '', c, '', '', E.fmt(sg * S.open, A.dec(c))]);
          S.rows.forEach(r => csvRows.push([r.date, (T[r.type] || {}).short + ' ' + (r.num || ''), lineDesc(r), c, r.dr ? E.fmt(r.dr, A.dec(c)) : '', r.cr ? E.fmt(r.cr, A.dec(c)) : '', E.fmt(sg * r.bal, A.dec(c))]));
          txt.push('— ' + lbl + ' —'); txt.push('رصيد سابق: ' + money(sg * S.open, c));
          S.rows.forEach(r => txt.push(`${r.date} | ${(T[r.type] || {}).short} ${r.num || ''} | ${r.dr ? '+' + money(r.dr, c) : '-' + money(r.cr, c)} | الرصيد ${money(sg * r.bal, c)}`));
          txt.push('الرصيد النهائي: ' + money(sg * S.close, c) + ' ' + CUR_LBL[c]); txt.push('');
        });
        const b = A.balOf(id);
        const phone = a && a.phone ? String(a.phone).replace(/\D/g, '').replace(/^0/, '964') : '';
        ctx.out.innerHTML = `<div class="card"><div class="row"><div><b style="font-size:17px">${esc(a ? a.name : '')}</b> <span class="muted small n">${esc(a ? a.code : '')}</span>${a && a.phone ? ` · <span class="n">${esc(a.phone)}</span>` : ''}</div><span class="sp" style="flex:1"></span>
          <span>الرصيد الحالي: ${b.IQD || !b.USD ? moneyC(sg * b.IQD, 'IQD') : ''} ${b.USD ? moneyC(sg * b.USD, 'USD') : ''}</span>
          ${phone ? `<a class="btn sm" href="https://wa.me/${phone}?text=${encodeURIComponent(txt.join('\n').slice(0, 1800))}" target="_blank" rel="noopener">إرسال واتساب</a>` : ''}</div></div>` + (blocks.join('') || '<div class="card empty">ماكو حركة</div>');
        bindDocs(ctx);
        ctx.csv = () => csvRows; ctx.copy = () => txt.join('\n'); ctx.print = () => `<h2>كشف حساب: ${esc(a ? a.name : '')}</h2><p>من ${esc(rs.from || 'البداية')} إلى ${esc(rs.to)}</p>` + ctx.out.innerHTML.replace(/<a [^>]*class="btn[^"]*"[^>]*>.*?<\/a>/g, '');
      };
      if (!rs.cur) rs.cur = 'both';
      filters(ctx, [{ k: 'acc', l: 'الحساب', type: 'acc', pred: () => true }, { k: 'from', l: 'من', type: 'date', def: yearStart() }, { k: 'to', l: 'إلى', type: 'date', def: today() }, { k: 'cur', l: 'العملة', type: 'sel', def: 'both', opts: [['both', 'كل عملة لحالها'], ['IQD', 'دينار فقط'], ['USD', 'دولار فقط'], ['base', 'الكل بالدينار المكافئ']] }], draw);
      const inp = $('#rf-acc', ctx.filt);
      // الكشف يقبل الحسابات الرئيسية أيضاً
      A.bindAC(inp, q => A.data.accounts.filter(x => A.match(q, x.name, x.code, x.phone)).slice(0, 40).map(x => ({ id: x.id, label: x.name, hint: esc(x.code) + (x.group ? ' · رئيسي' : '') })), o => { inp.value = o.label; inp.dataset.id = o.id; rs.acc = o.id; draw(); });
      draw();
    },

    /* أعمار الديون */
    debts(ctx) {
      const rs = ctx.rs;
      const draw = () => {
        const isC = rs.kind !== 'supplier'; const list = isC ? A.customers() : A.suppliers(); const sg = isC ? 1 : -1;
        const cur = rs.cur || 'IQD'; const tot = [0, 0, 0, 0, 0];
        const rowsData = list.map(a => { const ag = E.aging(A.S, a.id, cur, rs.to); return { a, ag }; }).filter(x => x.ag.total).sort((x, y) => sg * y.ag.total - sg * x.ag.total);
        const rows = rowsData.map(({ a, ag }) => { tot[0] += sg * ag.total; ag.buckets.forEach((v, i) => { tot[i + 1] += sg * v; }); return `<tr class="click" data-st="${a.id}"><td>${esc(a.name)}<br><span class="small muted">${esc(a.phone || '')}</span></td><td class="n ${signCls(sg * ag.total)}"><b>${money(sg * ag.total, cur)}</b></td>${ag.buckets.map((v, i) => `<td class="n ${i >= 2 && v ? 'neg-v' : ''}">${v ? money(sg * v, cur) : ''}</td>`).join('')}<td class="small muted">${ag.oldest && ag.oldest !== '0000-00-00' ? esc(ag.oldest) : ag.oldest ? 'افتتاحي' : ''}</td></tr>`; });
        ctx.out.innerHTML = table([['الاسم'], ['الرصيد', 'n'], ['0-30 يوم', 'n'], ['31-60', 'n'], ['61-90', 'n'], ['أكثر من 90', 'n'], ['أقدم دين']], rows, `<tr class="tot"><td>المجموع</td>${tot.map(v => `<td class="n">${money(v, cur)}</td>`).join('')}<td></td></tr>`);
        $$('[data-st]', ctx.out).forEach(r => r.onclick = () => A.openStatement(r.dataset.st));
        ctx.csv = () => [['الاسم', 'الرصيد', '0-30', '31-60', '61-90', '90+']].concat(rowsData.map(({ a, ag }) => [a.name, E.fmt(sg * ag.total, A.dec(cur))].concat(ag.buckets.map(v => E.fmt(sg * v, A.dec(cur))))));
        ctx.print = () => `<h2>أعمار ديون ${isC ? 'الزبائن' : 'الموردين'} بال${CUR_NAME[cur]} حتى ${esc(rs.to)}</h2>` + ctx.out.innerHTML;
      };
      filters(ctx, [{ k: 'kind', l: 'النوع', type: 'sel', def: 'customer', opts: [['customer', 'الزبائن'], ['supplier', 'الموردين']] }, { k: 'cur', l: 'العملة', type: 'sel', def: 'IQD', opts: [['IQD', 'دينار'], ['USD', 'دولار']] }, { k: 'to', l: 'حتى تاريخ', type: 'date', def: today() }], draw);
      draw();
    },

    /* حركة الصناديق */
    cash(ctx) {
      const rs = ctx.rs;
      const draw = () => {
        const boxes = rs.box ? [A.acc(rs.box)].filter(Boolean) : A.cashAccs();
        const days = new Map(); const csvRows = [['اليوم', 'الصندوق', 'العملة', 'أول اليوم', 'وارد', 'صادر', 'آخر اليوم']];
        const blocks = boxes.map(b => {
          const c = b.cur || 'IQD'; const S = E.statement(A.S, b.id, { from: rs.from, to: rs.to, cur: c });
          let bal = S.open; const per = new Map();
          S.rows.forEach(r => { const d = per.get(r.date) || { open: null, in: 0, out: 0 }; if (d.open == null) d.open = r.bal - (r.dr - r.cr); d.in += r.dr; d.out += r.cr; per.set(r.date, d); bal = r.bal; });
          const rows = Array.from(per.entries()).map(([d, v]) => { csvRows.push([d, b.name, c, E.fmt(v.open, A.dec(c)), E.fmt(v.in, A.dec(c)), E.fmt(v.out, A.dec(c)), E.fmt(v.open + v.in - v.out, A.dec(c))]); return `<tr><td class="n">${esc(d)}</td><td class="n">${money(v.open, c)}</td><td class="n pos-v">${money(v.in, c)}</td><td class="n neg-v">${money(v.out, c)}</td><td class="n"><b>${money(v.open + v.in - v.out, c)}</b></td></tr>`; });
          void days;
          return `<div class="card-h" style="margin-top:6px"><h2>${esc(b.name)}</h2><span class="sp"></span><span class="chip ${c}">الرصيد ${money(S.close, c)} ${CUR_LBL[c]}</span></div>` + table([['اليوم'], ['أول اليوم', 'n'], ['الوارد', 'n'], ['الصادر', 'n'], ['آخر اليوم', 'n']], rows, `<tr class="tot"><td>المجموع</td><td class="n">${money(S.open, c)}</td><td class="n">${money(S.dr, c)}</td><td class="n">${money(S.cr, c)}</td><td class="n">${money(S.close, c)}</td></tr>`);
        });
        ctx.out.innerHTML = blocks.join('') || '<div class="card empty">ماكو صناديق</div>';
        ctx.csv = () => csvRows; ctx.print = () => `<h2>حركة الصناديق من ${esc(rs.from)} إلى ${esc(rs.to)}</h2>` + ctx.out.innerHTML;
      };
      filters(ctx, [{ k: 'box', l: 'الصندوق', type: 'sel', def: '', opts: [['', 'كل الصناديق']].concat(A.cashAccs().map(a => [a.id, a.name])) }, { k: 'from', l: 'من', type: 'date', def: monthStart(today()) }, { k: 'to', l: 'إلى', type: 'date', def: today() }], draw);
      draw();
    },

    /* الأرباح */
    profit(ctx) {
      const rs = ctx.rs;
      const draw = () => {
        const by = rs.by || 'doc'; const g = new Map();
        const keyOf = r => by === 'doc' ? r.doc : by === 'item' ? r.item : by === 'party' ? (r.party || '_cash') : by === 'rep' ? (r.rep || '_none') : by === 'group' ? ((A.item(r.item) || {}).group || '_none') : r.date;
        A.S.lineRes.forEach(r => {
          if (r.date < rs.from || r.date > rs.to) return;
          if (rs.wh && r.wh !== rs.wh) return;
          const k = keyOf(r); const x = g.get(k) || { qty: 0, rev: 0, cost: 0, n: new Set(), r }; x.qty += r.bq; x.rev += r.rev; x.cost += r.cost; x.n.add(r.doc); g.set(k, x);
        });
        const name = (k, x) => {
          if (by === 'doc') { const d = A.data.docs.get(k); return d ? `<a href="#" data-doc="${k}">${esc(T[d.type].short)} ${esc(d.num)}</a> <span class="small muted">${esc(d.date)} · ${esc(d.party ? A.accName(d.party) : 'نقدي')}</span>` : k; }
          if (by === 'item') return esc((A.item(k) || {}).name || k);
          if (by === 'party') return k === '_cash' ? 'بيع نقدي' : esc(A.accName(k));
          if (by === 'rep') { const rp = (st().reps || []).find(r => r.id === k); return rp ? esc(rp.name) : 'بدون مندوب'; }
          if (by === 'group') { const gg = A.data.groups.find(x => x.id === k); return gg ? esc(gg.name) : 'بدون مجموعة'; }
          return esc(k);
        };
        const list = Array.from(g.entries()).sort((a, b) => by === 'day' || by === 'doc' ? (a[1].r.date < b[1].r.date ? 1 : -1) : (b[1].rev - b[1].cost) - (a[1].rev - a[1].cost));
        let tR = 0, tC = 0;
        const rows = list.map(([k, x]) => { tR += x.rev; tC += x.cost; const p = x.rev - x.cost; const m = x.rev ? E.mulDiv(p, 100000, x.rev) : 0; return `<tr><td>${name(k, x)}</td>${by === 'item' ? `<td class="n">${qtyF(x.qty)}</td>` : `<td class="n">${x.n.size}</td>`}<td class="n">${money(x.rev)}</td><td class="n">${money(x.cost)}</td><td class="n ${signCls(p)}"><b>${money(p)}</b></td><td class="n small">${E.fmt(m, 1)}%</td></tr>`; });
        const tp = tR - tC;
        ctx.out.innerHTML = `<div class="kpis"><div class="kpi"><span class="k">صافي المبيعات</span><span class="v n">${money(tR)}</span><span class="s">د.ع بعد الخصم والمرتجع</span></div><div class="kpi"><span class="k">كلفة المبيعات</span><span class="v n">${money(tC)}</span></div><div class="kpi accent"><span class="k">مجمل الربح</span><span class="v n ${signCls(tp)}">${money(tp)}</span><span class="s">هامش ${tR ? E.fmt(E.mulDiv(tp, 100000, tR), 1) : 0}%</span></div></div>` +
          table([['البيان'], [by === 'item' ? 'الكمية' : 'عدد الفواتير', 'n'], ['المبيعات د.ع', 'n'], ['الكلفة د.ع', 'n'], ['الربح د.ع', 'n'], ['الهامش', 'n']], rows, `<tr class="tot"><td>المجموع</td><td></td><td class="n">${money(tR)}</td><td class="n">${money(tC)}</td><td class="n">${money(tp)}</td><td></td></tr>`);
        bindDocs(ctx);
        ctx.csv = () => [['البيان', 'المبيعات', 'الكلفة', 'الربح']].concat(list.map(([k, x]) => [name(k, x).replace(/<[^>]+>/g, ''), E.fmt(x.rev, 0), E.fmt(x.cost, 0), E.fmt(x.rev - x.cost, 0)]));
        ctx.print = () => `<h2>أرباح المبيعات من ${esc(rs.from)} إلى ${esc(rs.to)}</h2>` + ctx.out.innerHTML;
      };
      filters(ctx, [{ k: 'by', l: 'حسب', type: 'sel', def: 'doc', opts: [['doc', 'الفاتورة'], ['item', 'المادة'], ['group', 'المجموعة'], ['party', 'الزبون'], ['rep', 'المندوب'], ['day', 'اليوم']] }, { k: 'from', l: 'من', type: 'date', def: monthStart(today()) }, { k: 'to', l: 'إلى', type: 'date', def: today() }, { k: 'wh', l: 'المخزن', type: 'sel', def: '', opts: whOpts() }], draw);
      draw();
    },

    /* سجل الفواتير */
    sales(ctx) {
      const rs = ctx.rs;
      const draw = () => {
        const types = rs.t === 'all' ? ['sale', 'sret', 'purchase', 'pret'] : [rs.t];
        const list = A.docsArr().filter(d => types.includes(d.type) && d.status !== 'deleted' && d.date >= rs.from && d.date <= rs.to && (!rs.party || d.party === rs.party)).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.seq || 0) - (b.seq || 0));
        const tot = { IQD: { t: 0, p: 0 }, USD: { t: 0, p: 0 } };
        const rows = list.map(d => { const r = A.S.docRes.get(d.id) || { total: 0, paid: 0 }; const c = d.cur || 'IQD'; const sg = d.type === 'sret' || d.type === 'pret' ? -1 : 1; tot[c].t += sg * r.total; tot[c].p += sg * (r.paid || 0); return `<tr><td class="n">${esc(d.date)}</td><td><a href="#" data-doc="${d.id}">${esc(T[d.type].short)} ${esc(d.num)}</a></td><td>${esc(d.party ? A.accName(d.party) : 'نقدي')}</td><td class="n">${money(sg * r.total, c)} ${curChip(c)}</td><td class="n">${money(sg * (r.paid || 0), c)}</td><td class="n">${money(sg * (r.total - (r.paid || 0)), c)}</td></tr>`; });
        const foot = ['IQD', 'USD'].filter(c => tot[c].t || tot[c].p).map(c => `<tr class="tot"><td colspan="3">المجموع بال${CUR_NAME[c]}</td><td class="n">${money(tot[c].t, c)}</td><td class="n">${money(tot[c].p, c)}</td><td class="n">${money(tot[c].t - tot[c].p, c)}</td></tr>`).join('');
        ctx.out.innerHTML = table([['التاريخ'], ['الفاتورة'], ['الحساب'], ['الصافي', 'n'], ['الواصل', 'n'], ['الباقي (آجل)', 'n']], rows, foot);
        bindDocs(ctx);
        ctx.csv = () => [['التاريخ', 'النوع', 'الرقم', 'الحساب', 'العملة', 'الصافي', 'الواصل']].concat(list.map(d => { const r = A.S.docRes.get(d.id) || {}; return [d.date, T[d.type].short, d.num, d.party ? A.accName(d.party) : 'نقدي', d.cur || 'IQD', E.fmt(r.total || 0, A.dec(d.cur || 'IQD')), E.fmt(r.paid || 0, A.dec(d.cur || 'IQD'))]; }));
        ctx.print = () => `<h2>سجل الفواتير من ${esc(rs.from)} إلى ${esc(rs.to)}</h2>` + ctx.out.innerHTML;
      };
      filters(ctx, [{ k: 't', l: 'النوع', type: 'sel', def: 'sale', opts: [['sale', 'المبيعات'], ['sret', 'مرتجع المبيعات'], ['purchase', 'المشتريات'], ['pret', 'مرتجع المشتريات'], ['all', 'الكل']] }, { k: 'from', l: 'من', type: 'date', def: monthStart(today()) }, { k: 'to', l: 'إلى', type: 'date', def: today() }, { k: 'party', l: 'الزبون/المورد', type: 'acc' }], draw);
      draw();
    },

    /* جرد المخزون */
    stock(ctx) {
      const rs = ctx.rs; const showCost = can('costs');
      const draw = () => {
        const S = E.stockAt(A.S, rs.to); const whs = rs.wh ? A.data.warehouses.filter(w => w.id === rs.wh) : A.data.warehouses;
        let tv = 0;

          const lines = list.filter(x => sel.has(x.acc.id)).map(x => ({ acc: x.acc.id, base: x.diff })); if (!lines.length) return;
