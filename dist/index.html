  --muted: #8F9BB2;
  --line: rgba(255, 255, 255, .08);
  --card: rgba(14, 22, 40, .74);
  --card-solid: #111A2D;
  --glass-border: rgba(255, 255, 255, .09);
  --shadow: 0 12px 34px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .35);
  --shadow-sm: 0 3px 12px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg2); }
body { font-family: var(--font); color: var(--fg); font-size: 16px; line-height: 1.45; overscroll-behavior: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
input, textarea { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
svg { width: 24px; height: 24px; flex: none; }
.hidden { display: none !important; }

#map { position: fixed; inset: 0; }
.maplibregl-ctrl-attrib { font-size: 10px; font-family: system-ui, sans-serif; }
.maplibregl-ctrl-bottom-left { bottom: calc(var(--sab) + 4px); }
body.navigating .maplibregl-ctrl-bottom-left { bottom: calc(var(--sab) + 92px); }
body.navigating .maplibregl-ctrl-bottom-right { bottom: calc(var(--sab) + 92px); }

/* ---------------- شريط البحث ---------------- */
.topbar { position: fixed; top: 0; left: 0; right: 0; padding: calc(var(--sat) + 10px) calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px); z-index: 20; pointer-events: none; transition: transform .25s ease, opacity .25s; }
.topbar > * { pointer-events: auto; }
.search-row { display: flex; gap: 8px; align-items: center; }
.search-box { flex: 1; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 14px; background: var(--card); border-radius: 26px; box-shadow: var(--shadow); }
.search-box .ico { color: var(--muted); width: 22px; height: 22px; }
.search-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 17px; color: var(--fg); height: 100%; }
.search-box input::placeholder { color: var(--muted); }
.search-box input::-webkit-search-cancel-button { display: none; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.topbar .icon-btn#btnMenu { width: 52px; height: 52px; background: var(--card); box-shadow: var(--shadow); }
.icon-btn.sm { width: 32px; height: 32px; }
.icon-btn.sm svg { width: 18px; height: 18px; }
.icon-btn:active { transform: scale(.94); }
.icon-btn.round { background: var(--bg2); width: 52px; height: 52px; }
.icon-btn.danger { color: var(--danger); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow-sm); white-space: nowrap; font-size: 14px; font-weight: 500; flex: none; }
.chip svg { width: 18px; height: 18px; color: var(--accent); }
.chip:active { transform: scale(.96); }

/* ---------------- لوحة البحث ---------------- */
.search-panel { position: fixed; inset: 0; z-index: 15; background: var(--bg); padding-top: calc(var(--sat) + 76px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.list { padding: 4px 0 calc(var(--sab) + 20px); }
.list-title { font-size: 13px; color: var(--muted); padding: 14px 20px 6px; font-weight: 600; }
.item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 18px; text-align: right; border-bottom: 1px solid var(--line); }
.item:active { background: var(--bg2); }
.item .item-ico { width: 40px; height: 40px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center; color: var(--accent); flex: none; }
.item .item-ico svg { width: 20px; height: 20px; }
.item .item-main { flex: 1; min-width: 0; }
.item .item-name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .item-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .item-end { font-size: 13px; color: var(--muted); flex: none; }
.empty { padding: 36px 24px; text-align: center; color: var(--muted); }
.spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 24px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------- أزرار عائمة ---------------- */
.fab-col { position: fixed; left: calc(var(--sal) + 14px); bottom: calc(var(--sab) + 26px); display: flex; flex-direction: column; gap: 12px; z-index: 12; transition: bottom .25s ease; }
.fab { width: 54px; height: 54px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--fg); }
.fab.sm { width: 44px; height: 44px; }
.fab.sm svg { width: 26px; height: 26px; }
.fab:active { transform: scale(.93); }
.fab.active { color: var(--accent); }
.fab.report { position: fixed; right: calc(var(--sar) + 14px); bottom: calc(var(--sab) + 26px); z-index: 12; background: var(--accent2); color: #fff; width: 60px; height: 60px; }
.fab.report svg { width: 30px; height: 30px; color: #fff; }
.fab.report svg path:first-child { fill: rgba(0,0,0,.18); }
body.navigating .fab.report { bottom: calc(var(--sab) + 104px); }
body.navigating .fab-col { bottom: calc(var(--sab) + 104px); }
body.navigating #btnLocate { display: none; }
body.sheet-open .fab-col, body.sheet-open .fab.report { opacity: 0; pointer-events: none; }

.pill { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 23px; background: var(--card); box-shadow: var(--shadow); font-weight: 700; color: var(--accent); }
.pill svg { width: 20px; height: 20px; }
.recenter { position: fixed; bottom: calc(var(--sab) + 106px); left: 50%; transform: translateX(-50%); z-index: 13; }

/* ---------------- الملاحة ---------------- */
.nav-top { position: fixed; top: 0; left: 0; right: 0; z-index: 18; padding: calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px); pointer-events: none; }
.nav-top > * { pointer-events: auto; }
.banner { --banner-bg: var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 22px; display: flex; align-items: center; gap: 14px; padding: 14px 16px; box-shadow: var(--shadow); min-height: 96px; }
.banner.off { background: #5B6475; --banner-bg: #5B6475; }
.m-icon { width: 64px; height: 64px; flex: none; color: #fff; }
.m-icon svg, .then-icon svg { width: 100%; height: 100%; }
.m-text { flex: 1; min-width: 0; }
.m-dist { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -.5px; }
.m-dist small { font-size: 20px; font-weight: 600; margin-inline-start: 6px; opacity: .9; }
.m-road { font-size: 19px; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .96; }
.banner-sub { display: flex; gap: 8px; margin-top: 8px; align-items: stretch; }
.lanes { display: flex; gap: 2px; background: #10161F; border-radius: 14px; padding: 6px 8px; box-shadow: var(--shadow-sm); }
.lane { width: 34px; height: 38px; color: #5D6778; display: grid; place-items: center; }
.lane svg { width: 30px; height: 30px; }
.lane.on { color: #fff; }
.then { display: flex; align-items: center; gap: 6px; background: var(--card); color: var(--fg); border-radius: 14px; padding: 4px 12px; font-weight: 600; box-shadow: var(--shadow-sm); }
.then-icon { width: 30px; height: 30px; color: var(--fg); }
.nav-status { margin-top: 8px; background: #263142; color: #fff; padding: 10px 14px; border-radius: 14px; font-weight: 600; font-size: 15px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow-sm); }
.nav-status .spinner { width: 18px; height: 18px; margin: 0; border-width: 2.5px; border-color: rgba(255,255,255,.3); border-top-color: #fff; }

.speedo { position: fixed; z-index: 13; right: calc(var(--sar) + 14px); bottom: calc(var(--sab) + 176px); width: 64px; height: 64px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.speedo b { font-size: 24px; }
.speedo small { font-size: 10px; color: var(--muted); margin-top: 2px; }
.speedo.over { background: var(--danger); color: #fff; animation: pulse 1s ease-in-out infinite; }
.speedo.over small { color: #fff; }
@keyframes pulse { 50% { transform: scale(1.08); } }

.nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; z-index: 18; background: var(--card); box-shadow: 0 -4px 20px rgba(0,0,0,.12); border-radius: 24px 24px 0 0; padding: 12px calc(var(--sar) + 14px) calc(var(--sab) + 12px) calc(var(--sal) + 14px); display: flex; align-items: center; gap: 12px; }
.eta { flex: 1; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.eta-time { font-size: 26px; font-weight: 700; color: var(--ok); }
.eta-sub { font-size: 15px; color: var(--muted); font-weight: 500; }

/* ---------------- بطاقة التنبيه ---------------- */
.alert-card { position: fixed; z-index: 19; left: calc(var(--sal) + 12px); right: calc(var(--sar) + 12px); bottom: calc(var(--sab) + 100px); background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; display: flex; gap: 12px; align-items: center; animation: rise .25s ease; overflow: hidden; }
body:not(.navigating) .alert-card { bottom: calc(var(--sab) + 100px); }
.alert-card .a-ico { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; flex: none; }
.alert-card .a-main { flex: 1; min-width: 0; }
.alert-card .a-title { font-weight: 700; font-size: 17px; }
.alert-card .a-sub { color: var(--muted); font-size: 14px; }
.alert-card .a-actions { display: flex; gap: 8px; flex: none; }
.alert-card .a-progress { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--accent); transform-origin: left; }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 20px; border-radius: 25px; font-weight: 700; font-size: 16px; background: var(--bg2); color: var(--fg); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.go { background: var(--ok); color: #fff; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.sm { height: 40px; padding: 0 14px; font-size: 14px; border-radius: 20px; }
.btn.block { width: 100%; }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* ---------------- اللوحة السفلية ---------------- */
.backdrop { position: fixed; inset: 0; background: rgba(8, 12, 20, .35); z-index: 30; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--bg); border-radius: 26px 26px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); max-height: 88vh; max-height: 88dvh; display: flex; flex-direction: column; animation: slideUp .26s cubic-bezier(.2,.9,.3,1); padding-bottom: var(--sab); }
.sheet.peek { max-height: 62vh; max-height: 62dvh; }
.sheet.no-backdrop { box-shadow: 0 -6px 26px rgba(0,0,0,.2); }
@keyframes slideUp { from { transform: translateY(100%); } }
.grabber { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 10px auto 4px; flex: none; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 18px 18px; }
.sheet h2 { font-size: 21px; margin: 6px 0 2px; font-weight: 700; }
.sheet h3 { font-size: 14px; color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
.sheet .sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.actions { display: flex; gap: 10px; margin-top: 14px; }
.actions .btn { flex: 1; }

/* خيارات الطرق */
.routes { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.route-opt { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--bg2); border: 2px solid transparent; text-align: right; width: 100%; }
.route-opt.sel { border-color: var(--route); background: color-mix(in srgb, var(--route) 10%, var(--bg)); }
.route-opt .r-time { font-size: 22px; font-weight: 700; min-width: 86px; }
.route-opt .r-main { flex: 1; min-width: 0; }
.route-opt .r-via { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.route-opt .r-dist { font-size: 14px; font-weight: 600; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--ok); color: #fff; margin-inline-start: 4px; vertical-align: middle; }
.badge.warn { background: var(--warn); }
.badge.bad { background: var(--danger); }

/* شبكة البلاغات */
.report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
.report-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border-radius: 18px; background: var(--bg2); font-weight: 600; font-size: 14px; }
.report-btn .r-ico { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; box-shadow: var(--shadow-sm); }
.report-btn:active { transform: scale(.95); }

/* الإعدادات */
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row .set-label { flex: 1; }
.set-row .set-label small { display: block; color: var(--muted); font-size: 13px; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 15px; transition: .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(-22px); }
.seg { display: inline-flex; background: var(--bg2); border-radius: 12px; padding: 3px; flex: none; }
.seg button { padding: 7px 12px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow-sm); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--line); position: relative; }
.swatch.on { box-shadow: 0 0 0 3px var(--fg); }
.swatch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.swatch.custom { background: conic-gradient(#f44336, #ffeb3b, #4caf50, #00bcd4, #3f51b5, #e91e63, #f44336); }
.theme-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
.field { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--fg); padding: 0 12px; font: inherit; direction: ltr; text-align: left; }
.num-input { width: 86px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--fg); text-align: center; font: inherit; font-weight: 600; }
.menu-list .item { border-bottom: 0; border-radius: 14px; padding: 12px 10px; }
.menu-list .item .item-ico { background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
.note { background: var(--bg2); border-radius: 14px; padding: 12px 14px; font-size: 14px; color: var(--muted); margin-top: 10px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.stat { background: var(--bg2); border-radius: 14px; padding: 12px; text-align: center; }
.stat b { display: block; font-size: 20px; }
.stat small { color: var(--muted); }

/* ---------------- علامات الخريطة ---------------- */
.car-marker { width: 54px; height: 54px; display: grid; place-items: center; pointer-events: none; }
.car-marker svg { width: 54px; height: 54px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
.me-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 4px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.1), 0 2px 8px rgba(0,0,0,.3); position: relative; }
.me-dot .me-cone { position: absolute; left: 50%; bottom: 50%; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid color-mix(in srgb, var(--accent) 35%, transparent); transform: translateX(-50%); transform-origin: 50% 100%; }
.dest-marker { width: 40px; height: 50px; pointer-events: none; }
.dest-marker svg { width: 40px; height: 50px; filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); }
.pin-marker svg { width: 36px; height: 46px; filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); }
.rep-marker { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); cursor: pointer; }
.rep-marker.mine { border-color: var(--accent2); }

/* ---------------- رسائل ---------------- */
.toast { position: fixed; z-index: 40; left: 50%; top: calc(var(--sat) + 80px); transform: translateX(-50%); background: #1D2533; color: #fff; padding: 12px 18px; border-radius: 16px; font-weight: 600; font-size: 15px; box-shadow: var(--shadow); max-width: calc(100vw - 40px); text-align: center; animation: drop .25s ease; }
body.navigating .toast { top: calc(var(--sat) + 160px); }
@keyframes drop { from { transform: translate(-50%, -16px); opacity: 0; } }

.splash { position: fixed; inset: 0; z-index: 100; background: var(--accent); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: opacity .4s ease; }
.splash.out { opacity: 0; pointer-events: none; }
.splash-logo { width: 96px; height: 96px; border-radius: 28px; background: rgba(255,255,255,.18); display: grid; place-items: center; margin-bottom: 10px; }
.splash-logo svg { width: 54px; height: 54px; color: #fff; }
.splash-name { font-size: 40px; font-weight: 700; }
.splash-sub { opacity: .85; }
.splash-msg { margin-top: 18px; font-size: 14px; opacity: .9; min-height: 20px; padding: 0 30px; text-align: center; }
.splash-msg .btn { margin-top: 12px; background: #fff; color: var(--accent); }
.howto { background: rgba(255,255,255,.14); border-radius: 18px; padding: 14px 16px; text-align: right; font-size: 14.5px; line-height: 1.7; max-width: 380px; }
.howto b { font-size: 16px; }
.howto p { margin: 6px 0; }
.howto ol { margin: 6px 0 0; padding-inline-start: 20px; }
.noscript { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; z-index: 200; }

/* شاشات عريضة (تابلت/كمبيوتر) */
@media (min-width: 720px) {
  .topbar { right: auto; width: 420px; }
  .search-panel { right: auto; width: 444px; box-shadow: var(--shadow); }
  .sheet { right: auto; left: 12px; width: 440px; bottom: 12px; border-radius: 24px; }
  .nav-top { right: auto; width: 460px; }
  .alert-card { right: auto; width: 440px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .nav-top { right: auto; width: 46%; }
  .banner { min-height: 72px; padding: 10px 12px; }
  .m-icon { width: 48px; height: 48px; }
  .m-dist { font-size: 30px; }
  .sheet { max-height: 92vh; right: auto; width: 60%; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


/* =====================================================================
   الطبقة الفخمة — زجاج، ذهب، وحركة ناعمة
   ===================================================================== */
.search-box, .topbar .icon-btn#btnMenu, .fab, .chip, .nav-bottom, .alert-card, .speedo, .pill, .then {
  background: var(--card);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  backdrop-filter: blur(18px) saturate(170%);
  border: 1px solid var(--glass-border);
}
.sheet {
  background: var(--card-solid);
  border-top: 1px solid var(--glass-border);
}
body.night .sheet { background: linear-gradient(180deg, #121C31 0%, #0B1222 100%); }
.search-panel { background: var(--bg); }
body.night .search-panel { background: radial-gradient(120% 60% at 50% 0%, #15233F 0%, #0A1120 60%); }

.search-box { box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.06); }
.search-box:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.chip svg { color: var(--gold); }
body:not(.night) .chip svg { color: color-mix(in srgb, var(--accent) 80%, #6b4d0a); }

.btn.primary { background: var(--accent-grad); color: var(--accent-ink); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.go { background: linear-gradient(135deg, #2BD27A 0%, #13A35A 100%); box-shadow: 0 6px 18px rgba(19, 163, 90, .35); }
.fab.report { background: radial-gradient(circle at 30% 25%, #FFD27A 0%, var(--accent2) 55%, #C46F12 100%); box-shadow: 0 8px 24px color-mix(in srgb, var(--accent2) 45%, transparent), var(--shadow); border: 1px solid rgba(255,255,255,.35); }
.fab.active { color: var(--gold); }

/* لافتة الملاحة */
.banner { background: var(--banner); color: var(--banner-ink); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 14px 36px rgba(5, 10, 25, .45), inset 0 1px 0 rgba(255,255,255,.08); position: relative; overflow: hidden; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.07) 45%, transparent 60%); transform: translateX(-100%); animation: sheen 6s ease-in-out infinite; pointer-events: none; }
@keyframes sheen { 0%, 70% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.m-icon { color: var(--banner-icon); filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
.m-dist { font-feature-settings: "tnum"; }
.banner.off { background: linear-gradient(135deg, #3A4256 0%, #262C3B 100%); }
.lanes { background: rgba(8, 13, 25, .88); border: 1px solid rgba(255,255,255,.08); }
.lane.on { color: var(--gold); }
.eta-time { background: linear-gradient(135deg, #2BD27A, #13A35A); -webkit-background-clip: text; background-clip: text; color: transparent; }
.eta-traffic { color: var(--danger); font-weight: 700; }
.speedo { border: 2px solid color-mix(in srgb, var(--gold) 55%, transparent); }

/* علامة السيارة: هالة نابضة */
.car-marker { width: 64px; height: 64px; }
.car-marker svg { width: 64px; height: 64px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
.car-marker::before { content: ""; position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 2px solid var(--route); opacity: 0; animation: ring 2.4s ease-out infinite; }
@keyframes ring { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
.dest-marker { width: 44px; height: 56px; }
.dest-marker svg { width: 44px; height: 56px; animation: bob 2.2s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.stop-marker { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #10151E; background: var(--gold-grad); border: 2.5px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35); }
.rep-marker { box-shadow: 0 4px 14px rgba(0,0,0,.4), 0 0 0 4px rgba(255,255,255,.12); }

/* المحطات بالمعاينة */
.stops { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 2px; }
.stop-row { display: flex; align-items: center; gap: 10px; background: var(--bg2); border-radius: 14px; padding: 8px 10px; font-size: 14px; }
.stop-row .num { width: 24px; height: 24px; border-radius: 50%; background: var(--gold-grad); color: #10151E; font-weight: 700; display: grid; place-items: center; font-size: 13px; flex: none; }
.stop-row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge.traffic { background: linear-gradient(135deg, #F57C00, #E0312E); }

/* الشاشة الافتتاحية: سماء نجوم + شعار ذهبي */
.splash { background: radial-gradient(120% 80% at 50% 30%, #1C2F58 0%, #0A1120 55%, #04070F 100%); overflow: hidden; }
.splash::before { content: ""; position: absolute; inset: -50%; background-image:
  radial-gradient(1.2px 1.2px at 20% 30%, rgba(255,255,255,.9), transparent 60%),
  radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,.7), transparent 60%),
  radial-gradient(1.4px 1.4px at 40% 70%, rgba(255,240,200,.8), transparent 60%),
  radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,.6), transparent 60%),
  radial-gradient(1.2px 1.2px at 10% 85%, rgba(255,255,255,.7), transparent 60%),
  radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,.5), transparent 60%);
  background-size: 240px 240px; animation: drift 40s linear infinite; opacity: .8; }
@keyframes drift { to { transform: translate(120px, 80px); } }
.splash > * { position: relative; }
.splash-logo { width: 116px; height: 116px; border-radius: 34px; background: radial-gradient(circle at 30% 25%, #22396A 0%, #0D1830 70%); border: 1px solid rgba(242, 207, 107, .35); box-shadow: 0 0 60px rgba(212, 175, 55, .25), inset 0 1px 0 rgba(255,255,255,.08); animation: glow 3s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 90px rgba(212, 175, 55, .45), inset 0 1px 0 rgba(255,255,255,.08); } }
.splash-logo svg { width: 66px; height: 66px; color: var(--gold); }
.splash-name { font-family: var(--font-brand); font-size: 52px; font-weight: 700; background: linear-gradient(100deg, #B08325 0%, #FBEAB0 30%, #E2B84A 50%, #FFF6D6 60%, #B08325 90%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 3.2s linear infinite; letter-spacing: .5px; }
@keyframes shimmer { to { background-position: -220% 0; } }
.splash-sub { color: #C9D3E6; letter-spacing: .5px; }
.splash-msg .btn { background: var(--gold-grad); color: #10151E; }
.howto { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: #E6ECF6; }

/* القوائم واللوحات */
.menu-list .item .item-ico { background: color-mix(in srgb, var(--gold) 14%, transparent); color: var(--gold); }
body:not(.night) .menu-list .item .item-ico { color: #9A7414; }
.route-opt.sel { border-color: var(--route); background: color-mix(in srgb, var(--route) 12%, var(--bg)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--route) 12%, transparent); }
.report-btn { background: var(--bg2); border: 1px solid var(--glass-border); }
.report-btn .r-ico { box-shadow: 0 6px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.35); }
.switch input:checked + span { background: var(--accent-grad); }
.brand-title { font-family: var(--font-brand); background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

.menu-logo { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: radial-gradient(circle at 30% 25%, #22396A 0%, #0D1830 75%); border: 1px solid rgba(242,207,107,.35); color: var(--gold); flex: none; box-shadow: 0 0 24px rgba(212,175,55,.2); }
.menu-logo svg { width: 36px; height: 36px; }
.menu-list .item .badge { flex: none; }

.toast { background: rgba(12, 19, 35, .9); color: #fff; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(242, 207, 107, .25); }

.actions .btn.sm { white-space: nowrap; padding: 0 11px; }

/* =====================================================================
   العقارات
   ===================================================================== */
.chips.wrap { flex-wrap: wrap; overflow: visible; padding: 4px 0; }
.chip.on { background: var(--accent-grad); color: var(--accent-ink); border-color: transparent; }
.chip.on svg { color: inherit; }
.estate-chip { background: linear-gradient(135deg, rgba(226,184,74,.95), rgba(176,131,37,.95)) !important; color: #10151E !important; font-weight: 700; }
body.estate #quickChips, body.estate .fab.report, body.estate #btnCompass { display: none !important; }
body.estate .fab-col { bottom: calc(var(--sab) + 210px); }
body.re-drawing #topbar, body.re-drawing .fab-col, body.re-drawing .fab.report, body.re-drawing .re-root { display: none !important; }

.re-root { position: fixed; inset: 0; pointer-events: none; z-index: 14; }
.re-root > * { pointer-events: auto; }
.re-bar { position: fixed; top: calc(var(--sat) + 72px); left: 0; right: 0; display: flex; gap: 8px; align-items: center; overflow-x: auto; padding: 4px calc(var(--sar) + 12px) 8px calc(var(--sal) + 12px); scrollbar-width: none; }
.re-bar::-webkit-scrollbar { display: none; }
.re-bar .chip { flex: none; }
.re-x { width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1px solid var(--glass-border); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); flex: none; font-size: 15px; box-shadow: var(--shadow-sm); }
.re-deal { flex: none; background: var(--card); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: var(--shadow-sm); }
.seg.wrap { flex-wrap: wrap; }
.re-hint { position: fixed; top: calc(var(--sat) + 124px); left: 50%; transform: translateX(-50%); background: rgba(12,19,35,.88); color: #fff; padding: 10px 16px; border-radius: 16px; font-size: 14px; font-weight: 600; white-space: nowrap; border: 1px solid rgba(242,207,107,.25); }
.re-bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 0 calc(var(--sab) + 10px); }
.re-row { display: flex; justify-content: space-between; align-items: center; padding: 0 calc(var(--sar) + 12px) 8px calc(var(--sal) + 12px); gap: 10px; }
.re-count { height: 40px; padding: 0 14px; border-radius: 20px; background: var(--card); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: var(--shadow-sm); font-size: 14px; color: var(--fg); }
.re-count b { color: var(--gold); font-size: 16px; }
.re-count.loading { opacity: .6; }
.re-add { height: 44px; padding: 0 18px; border-radius: 22px; background: var(--gold-grad); color: #10151E; font-weight: 700; font-size: 15px; box-shadow: 0 8px 22px rgba(212,175,55,.4); border: 1px solid rgba(255,255,255,.4); }
.re-cards { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px calc(var(--sar) + 12px) 4px calc(var(--sal) + 12px); scrollbar-width: none; }
.re-cards::-webkit-scrollbar { display: none; }
.re-card { flex: none; width: 82vw; max-width: 340px; scroll-snap-align: center; display: flex; gap: 10px; align-items: stretch; text-align: right; padding: 8px; border-radius: 18px; background: var(--card); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--glass-border); box-shadow: var(--shadow); position: relative; color: var(--fg); }
.re-card.sel { border-color: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 50%, transparent), var(--shadow); }
.re-list .re-card, .sheet .re-card { width: 100%; max-width: none; margin-bottom: 8px; background: var(--bg2); box-shadow: none; }
.re-thumb { width: 88px; height: 76px; border-radius: 13px; flex: none; display: grid; place-items: center; font-size: 34px; background: linear-gradient(135deg, #1B2D4F, #0D1830); background-size: cover; background-position: center; }
.re-thumb.big { width: 110px; height: 96px; }
.re-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.re-price { font-weight: 700; font-size: 17px; }
.re-price.sale, .re-big-price.sale { color: #C99A2E; }
body.night .re-price.sale, body.night .re-big-price.sale { color: #F2CF6B; }
.re-price.rent, .re-big-price.rent { color: #0E9CC9; }
body.night .re-price.rent, body.night .re-big-price.rent { color: #6FE0FF; }
.re-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.re-facts { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.re-fav { position: absolute; top: 8px; left: 10px; color: #E0312E; }
.re-empty { color: var(--muted); background: var(--card); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); padding: 16px; border-radius: 16px; width: 100%; text-align: center; border: 1px solid var(--glass-border); }

/* التفاصيل */
.re-gallery { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -18px 12px; padding: 0 18px; position: relative; scrollbar-width: none; }
.re-gallery::-webkit-scrollbar { display: none; }
.re-gallery img { height: 230px; width: 86%; flex: none; object-fit: cover; border-radius: 18px; scroll-snap-align: center; background: var(--bg2); }
.re-gallery img:only-child { width: 100%; }
.re-ph-ph { height: 150px; width: 100%; border-radius: 18px; display: grid; place-items: center; font-size: 60px; background: linear-gradient(135deg, #1B2D4F, #0D1830); color: #fff; }
.re-ph-ph small { font-size: 13px; opacity: .7; display: block; }
.re-gal-count { position: absolute; bottom: 10px; right: 30px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 12px; }
.re-big-price { font-size: 28px; font-weight: 700; line-height: 1.2; }
.re-head h2 { font-size: 19px; margin: 4px 0 8px; }
.re-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.badge.sale { background: var(--gold-grad); color: #10151E; }
.badge.rent { background: linear-gradient(135deg, #6FE0FF, #1AA9D6); color: #06202B; }
.badge.kind { background: var(--bg2); color: var(--fg); border: 1px solid var(--line); }
.badge.ok { background: var(--ok); }
.re-cmp { padding: 10px 12px; border-radius: 14px; font-weight: 600; font-size: 14px; margin: 6px 0; }
.re-cmp small { font-weight: 400; opacity: .75; }
.re-cmp.good { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.re-cmp.high { background: color-mix(in srgb, var(--warn) 15%, transparent); color: #C77A00; }
.re-facts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.re-fact { background: var(--bg2); border-radius: 14px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; border: 1px solid var(--glass-border); }
.re-fact span { font-size: 20px; }
.re-fact small { color: var(--muted); font-size: 11.5px; }
.re-fact b { font-size: 14px; }
.re-desc { white-space: pre-wrap; line-height: 1.7; margin: 4px 0; -webkit-user-select: text; user-select: text; }
.re-owner { background: color-mix(in srgb, var(--gold) 10%, transparent); border: 1px dashed color-mix(in srgb, var(--gold) 55%, transparent); border-radius: 16px; padding: 12px; margin: 12px 0; }
.link-btn { color: var(--muted); font-size: 13px; padding: 8px 0; text-decoration: underline; }
.re-cta { position: sticky; bottom: calc(-18px - var(--sab)); display: flex; gap: 8px; padding: 12px 0 6px; background: linear-gradient(transparent, var(--card-solid) 30%); margin-top: 8px; }
body.night .re-cta { background: linear-gradient(transparent, #0B1222 30%); }
.re-cta .btn { text-decoration: none; }
.re-cta .btn.go, .re-cta .btn.wa { flex: 1; }
.btn.wa { background: linear-gradient(135deg, #3DDC84, #128C4A); color: #fff; }
.btn.icon-only { width: 50px; padding: 0; flex: none; font-size: 20px; }
.btn.fav { color: #E0312E; }
.re-viewer { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.94); }
.re-viewer-strip { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; }
.re-viewer-strip img { width: 100vw; height: 100%; object-fit: contain; flex: none; scroll-snap-align: center; }
.re-viewer-x { position: absolute; top: calc(var(--sat) + 14px); right: 14px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff; font-size: 20px; }

/* المعالج */
.re-steps { display: flex; gap: 6px; justify-content: center; margin: 2px 0 8px; }
.re-steps span { width: 28px; height: 5px; border-radius: 3px; background: var(--line); }
.re-steps span.on { background: var(--gold-grad); width: 42px; }
.re-steps span.done { background: color-mix(in srgb, var(--gold) 55%, transparent); }
.re-deal-big { display: flex; margin: 10px 0; }
.re-deal-big button { flex: 1; padding: 11px; font-size: 16px; }
.re-kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0; }
.re-kind { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px; border-radius: 16px; background: var(--bg2); border: 1.5px solid var(--glass-border); font-weight: 600; font-size: 13.5px; }
.re-kind span { font-size: 28px; }
.re-kind.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--bg2)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent); }
.re-field { margin: 12px 0 4px; }
.re-field > small, .re-in > small { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 5px; font-weight: 600; }
.re-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 0; }
.re-in { display: block; flex: 1; }
.re-in.wide { margin: 10px 0; }
.re-in .field, .re-field .field { direction: rtl; text-align: right; }
.field.num { direction: ltr !important; text-align: center !important; font-weight: 600; }
.field.big { font-size: 20px; height: 52px; flex: 1; }
.field.area { height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.6; }
.re-price-help { color: var(--gold); font-weight: 600; min-height: 20px; margin: 6px 0 0; }
.re-photos { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
.re-ph { width: 84px; height: 84px; border-radius: 14px; overflow: hidden; position: relative; background: var(--bg2); border: 1px solid var(--glass-border); display: grid; place-items: center; }
.re-ph img { width: 100%; height: 100%; object-fit: cover; }
.re-ph button { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; }
.re-ph em { position: absolute; bottom: 0; left: 0; right: 0; font-style: normal; font-size: 11px; text-align: center; background: rgba(0,0,0,.55); color: #F2CF6B; padding: 2px; }
.re-ph.add { border: 2px dashed color-mix(in srgb, var(--gold) 60%, transparent); color: var(--gold); font-size: 26px; cursor: pointer; flex-direction: column; display: flex; justify-content: center; align-items: center; }
.re-ph.add small { font-size: 12px; }
.re-review { display: flex; gap: 12px; align-items: center; background: var(--bg2); border-radius: 18px; padding: 10px; }
.note.bad { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.re-progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 12px; }
.re-progress span { display: block; height: 100%; width: 0; background: var(--gold-grad); transition: width .2s; }

/* شاشة الرسم */
.re-draw-ui { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
.re-draw-ui > * { pointer-events: auto; }
.re-draw-top { position: fixed; top: calc(var(--sat) + 10px); left: 12px; right: 12px; background: linear-gradient(135deg, rgba(13,26,49,.92), rgba(27,49,87,.92)); color: #fff; border-radius: 20px; padding: 12px 16px; border: 1px solid rgba(242,207,107,.3); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.re-draw-title { font-weight: 700; font-size: 17px; color: #F2CF6B; }
.re-draw-stats { font-size: 13.5px; opacity: .9; margin-top: 2px; }
.re-cross { position: fixed; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none !important; }
.re-cross span, .re-cross::before, .re-cross::after { position: absolute; content: ""; }
.re-cross::before { left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #F2CF6B; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.re-cross::after { top: 50%; left: 0; right: 0; height: 2px; margin-top: -1px; background: #F2CF6B; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.re-cross span { left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 2px solid #fff; background: #D4AF37; }
.re-draw-tools { position: fixed; bottom: calc(var(--sab) + 82px); left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 6px; background: rgba(12,19,35,.9); border-radius: 20px; padding: 8px; border: 1px solid rgba(255,255,255,.1); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.tool { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #fff; font-size: 20px; padding: 6px 2px; border-radius: 14px; }
.tool small { font-size: 11px; opacity: .85; }
.tool.on { background: rgba(242,207,107,.2); color: #F2CF6B; }
.re-draw-actions { position: fixed; bottom: calc(var(--sab) + 14px); left: 12px; right: 12px; display: flex; gap: 10px; }
.re-draw-actions .btn { flex: 1; }
.re-draw-actions .btn:not(.primary) { background: rgba(12,19,35,.9); color: #fff; }
.re-vertex { width: 22px; height: 22px; border-radius: 50%; background: #F2CF6B; border: 3px solid #0E1A30; box-shadow: 0 2px 6px rgba(0,0,0,.4); cursor: grab; }
.re-vertex.first { background: #fff; border-color: #D4AF37; }
.re-len { background: rgba(13,26,49,.88); color: #F2CF6B; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 10px; white-space: nowrap; pointer-events: none; border: 1px solid rgba(242,207,107,.35); }
@media (min-width: 720px) {
  .re-card { width: 320px; }
  .re-bar { right: auto; max-width: 460px; }
}
a.item { text-decoration: none; color: inherit; }

/* مؤشر حالة الـGPS على زر موقعي */
#btnLocate { position: relative; }
#btnLocate.gps-searching::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2.5px solid var(--accent); opacity: .0; animation: gpsPulse 1.4s ease-out infinite; pointer-events: none; }
#btnLocate.gps-searching svg { animation: gpsBlink 1.4s ease-in-out infinite; }
#btnLocate.gps-weak::before, #btnLocate.gps-bad::before { content: ""; position: absolute; top: 5px; right: 5px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--card-solid, #fff); }

function fmtArea(a, kind) {

class KV {
  constructor(name) {
    this.mem = new Map();
    this.ready = new Promise((resolve) => {
      try {
        const req = indexedDB.open(name, 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => { this.db = req.result; resolve(); };
        req.onerror = () => resolve();
      } catch { resolve(); }
    });
  }
  async _tx(mode, fn) {
    await this.ready;
    if (!this.db) return fn(null);
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('kv', mode);
      const st = tx.objectStore('kv');
      let out;
      Promise.resolve(fn(st)).then((v) => { out = v; });
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('abort'));
    });
  }
  get(k) {
    return this._tx('readonly', (st) => (st ? new Promise((r) => { const q = st.get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(undefined); }) : this.mem.get(k)));
  }
  set(k, v) { return this._tx('readwrite', (st) => { if (st) st.put(v, k); else this.mem.set(k, v); }); }
  del(k) { return this._tx('readwrite', (st) => { if (st) st.delete(k); else this.mem.delete(k); }); }

    return this._tx('readonly', (st) => {
      if (!st) return [...this.mem.entries()].filter(([k]) => k.startsWith(prefix)).map(([, v]) => v);
      return new Promise((r) => {
        const out = [];
        const q = st.openCursor(IDBKeyRange.bound(prefix, `${prefix}￿`));
        q.onsuccess = () => { const c = q.result; if (c) { out.push(c.value); c.continue(); } else r(out); };
        q.onerror = () => r(out);
      });
    });
  }
}
