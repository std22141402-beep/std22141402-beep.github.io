/* ===== تطبيق الموبايل: الملفات، النسخ الاحتياطي، الطباعة، التحديث التلقائي ===== */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const IOSPWA=IOS&&STANDALONE;
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
/* حفظ ملف: بالآيفون يطلع خيار المشاركة (حفظ بالملفات، واتساب...)، وبالباقي ينزل مباشرة */
function saveFile(name,blob,done){const ok=()=>{if(done)done()};
 if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{if(!d)return T('التصدير غير متاح هنا',1);return d.save({filename:name,data:blob}).then(ok)}).catch(()=>{});return}
 let file=null;try{file=new File([blob],name,{type:blob.type})}catch(e){}
 if(IOS&&file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(ok).catch(e=>{if(!e||e.name!='AbortError')dl()});return}
 dl();function dl(){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);ok()}}
/* النسخ الاحتياطي */
const bkAge=()=>{const t=+LS.get('daftar:bk');return t?Math.floor((Date.now()-t)/864e5):null};
const bkTxt=()=>{const a=bkAge();return a===null?'ما مأخوذة بعد':a==0?'اليوم':a==1?'أمس':'قبل '+a+' يوم'};
const bkCard=()=>`<p class="mut" style="margin-top:0">بياناتك محفوظة على هذا الجهاز. خذ نسخة احتياطية بين فترة وفترة واحفظها بالملفات أو أرسلها لنفسك، وتگدر ترجعها بنفس الجهاز أو بجهاز ثاني.</p><p style="margin:0 0 12px">آخر نسخة: <b>${bkTxt()}</b></p><div class="row"><button class="btn" onclick="backup()">💾 أخذ نسخة احتياطية</button><button class="btn g" onclick="$('rsf').click()">📂 استرجاع نسخة</button></div><input type="file" id="rsf" accept=".json,application/json" style="display:none" onchange="restore(this)">`;
function backup(){if(!Object.keys(IMG).length)return bk0(null);T('جاري تجهيز النسخة ويا صور المواد…');imPack().then(im=>{const n=Object.keys(im).length;if(!n)return bk0(null);const d=dlg(`<h2 style="margin-bottom:6px">💾 النسخة الاحتياطية جاهزة</h2><p class="mut" style="margin:0 0 12px">تشمل كل البيانات و${f(n)} صورة مواد.</p><div class="row"><button class="btn" id="bkgo">حفظ / مشاركة النسخة</button><button class="btn g" onclick="this.closest('.dlg').remove()">إلغاء</button></div>`);d.querySelector('#bkgo').onclick=()=>{d.remove();bk0(im)}}).catch(()=>bk0(null))}
function bk0(im){const d=new Date(),n='daftar-backup-'+d.toISOString().slice(0,10)+'.json',j=JSON.stringify({app:'daftar',v:1,at:d.toISOString(),data:S,imgs:im||undefined});saveFile(n,new Blob([j],{type:'application/json'}),()=>{LS.set('daftar:bk',String(Date.now()));T('تم أخذ النسخة الاحتياطية ✓');if(tab=='usr'||tab=='dash')render()})}
function restore(el){const fl=el.files&&el.files[0];el.value='';if(!fl)return;const r=new FileReader();r.onload=()=>{let o=null,im=null;try{o=JSON.parse(r.result);if(o&&o.data){im=o.imgs||null;o=o.data}}catch(e){}
 if(!o||!Array.isArray(o.items)||!Array.isArray(o.inv))return T('هذا الملف مو نسخة احتياطية من دفتر',1);
 ask(`راح تنحذف البيانات الحالية وتنحط مكانها النسخة (${f(o.items.length)} مادة، ${f(o.inv.length)} فاتورة، ${f((o.parties||[]).length)} عميل${im?'، '+f(Object.keys(im).length)+' صورة':''}). متابعة؟`,()=>{try{localStorage.setItem('daftar:acc',JSON.stringify(o));sessionStorage.setItem('daftar:msg','تم استرجاع النسخة الاحتياطية ✓')}catch(e){return T('تعذّر الحفظ: مساحة الجهاز ممتلئة؟',1)}const rl=()=>location.reload();if(im){T('جاري استرجاع صور المواد…');imRestore(im).then(rl,rl)}else rl()},'استرجاع')};r.readAsText(fl)}
/* تنبيهات الواجهة: تثبيت التطبيق بالآيفون + تذكير النسخة الاحتياطية */
function appNotes(){let h='';
 if(IOS&&!STANDALONE&&LS.get('daftar:ih')!='1')h+=`<div class="note"><p><b>ثبّت دفتر كتطبيق:</b> اضغط زر المشاركة <b>⎋</b> بسفاري ثم «إضافة إلى الشاشة الرئيسية». سجّل بياناتك بعد التثبيت، لأن بيانات سفاري ما تنتقل للتطبيق.</p><button class="nx" onclick="LS.set('daftar:ih','1');render()" title="إخفاء">×</button></div>`;
 const a=bkAge(),has=S.items.length+S.inv.length>0;if(has&&(a===null||a>=7))h+=`<div class="note"><p>💾 آخر نسخة احتياطية: <b>${bkTxt()}</b></p><button class="btn" onclick="backup()">خذ نسخة</button></div>`;return h}
/* الطباعة: تطبيق الآيفون ما يسمح بالطباعة، فنفتح صفحة الطباعة بسفاري */
function b64(t){const u=new TextEncoder().encode(t);let o='';for(let i=0;i<u.length;i+=32768)o+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(o)}
function openPrint(o){try{o.pg=pgGet();o.css=(document.querySelector('style')||{}).textContent||'';o.co=S.co;const u=new URL('../daftar-print/',location.href).href+'#'+encodeURIComponent(b64(JSON.stringify(o)));const w=window.open(u,'_blank');if(!w)location.href=u}catch(e){T('تعذّرت الطباعة',1)}}
if(IOSPWA)window.print=function(){const pv=document.body.classList.contains('pv');openPrint({t:pv?'pv':'main',h:pv?$('pv').innerHTML:$('main').innerHTML})};

{const h0=location.hash.slice(1);if(h0&&NAV.some(t=>t[0]==h0))tab=h0}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&NAV.some(t=>t[0]==h)&&h!=tab)go(h)});

render();initDb();imLoad();
{let m=null;try{m=sessionStorage.getItem('daftar:msg');sessionStorage.removeItem('daftar:msg')}catch(e){}if(m)setTimeout(()=>T(m),300)}
/* التحديث التلقائي: كل ما ترفع تعديل على GitHub يوصل للتطبيق وحده */
(function(){if(!('serviceWorker' in navigator)||!(location.protocol=='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))return;
 navigator.serviceWorker.register('sw.js').catch(()=>{});
 const hs=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return h.toString(36)+t.length};
 const here=new URL('index.html',location.href).href;let cur=null,hid=Date.now();
 const net=()=>fetch(here+'?u='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():null).then(t=>t?hs(t):null).catch(()=>null);
 const saved=()=>window.caches?caches.match(here).then(r=>r?r.text():null).then(t=>t?hs(t):null).catch(()=>null):Promise.resolve(null);
 const safe=()=>!cart.length&&!document.querySelector('.dlg')&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
 function apply(n){let tried=null;try{tried=sessionStorage.getItem('daftar:upd')}catch(e){}
  if(tried!=n&&safe()){try{sessionStorage.setItem('daftar:upd',n);sessionStorage.setItem('daftar:msg','تم تحديث التطبيق لآخر نسخة ✓')}catch(e){}location.reload();return}
  if(!$('upd')){const b=document.createElement('div');b.id='upd';b.innerHTML='<p>يتوفر تحديث جديد للتطبيق</p><button>تحديث الآن</button>';b.querySelector('button').onclick=()=>{try{sessionStorage.setItem('daftar:msg','تم تحديث التطبيق لآخر نسخة ✓')}catch(e){}location.reload()};document.body.appendChild(b)}}
 async function check(){if(!navigator.onLine)return;const n=await net();if(!n)return;if(cur===null){cur=n;return}if(n!==cur)apply(n)}
 setTimeout(async()=>{cur=await saved();check()},3000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden){hid=Date.now();return}if(Date.now()-hid>20000)check()});
 setInterval(()=>{if(!document.hidden)check()},30*60*1000);
})();
