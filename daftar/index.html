.fxb.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}

.lbls{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}

@media print{.dlg,.camv{display:none!important}}
html{-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:transparent}

.note{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-inline-start:4px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.note p{margin:0;flex:1}.note .btn{width:auto;padding:8px 12px;font-size:14px;flex:none}
.note .nx{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:0 4px;flex:none}
#upd{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:14px;max-width:520px;margin:auto}
#upd p{margin:0;flex:1}#upd button{background:var(--gold);color:#3a2a00;border:0;border-radius:9px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
.camv .cmsg{color:#fff;margin:0;text-align:center;min-height:1.5em}
@media print{.note,#upd{display:none!important}}
.dbt td{white-space:normal;padding:9px 4px;font-size:14px;vertical-align:top}.dbt th{padding:8px 4px}.dbt td:first-child{white-space:nowrap}.dbt.dl td:first-child{white-space:normal}.dadd>summary{list-style:none;text-align:center}.dadd>summary::-webkit-details-marker{display:none}.dadd[open]>summary{background:var(--card)}.dbt td b,.dbt td span{word-break:keep-all}

<body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="pv"></div><div id="t"></div>
<script>
/* التاريخ والوقت بتوقيت الجهاز */
function ld(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function now(){return new Date().toTimeString().slice(0,5)}
function tm(h){if(!h)return '';const [H,M]=String(h).split(':').map(Number);return (H%12||12)+':'+String(M||0).padStart(2,'0')+' '+(H<12?'ص':'م')}
const tmS=h=>h?`<small class="mut" style="display:block">${tm(h)}</small>`:'';
let S;try{S=JSON.parse(localStorage.getItem('daftar:acc'))}catch(e){}
S=S||{};Object.assign(S,{items:S.items||[],parties:S.parties||[],inv:S.inv||[],vou:S.vou||[],exp:S.exp||[],chq:S.chq||[],users:S.users||[],wh:S.wh||[{id:0,name:'المخزن الرئيسي'}],co:S.co||'اسم شركتك',rates:S.rates||{USD:1310,EUR:1502,GBP:1773},sh:S.sh||{},cats:S.cats||[]});
S.items.forEach(i=>{if(!i.w)i.w={0:i.qty}});
/* وقت العمليات القديمة: رقم كل عملية بيه لحظة تسجيلها، فنطلع منه الوقت إذا ما محفوظ */
{const pd=n=>String(n).padStart(2,'0');let ch=0;const at=r=>{const ms=Math.floor((+r.id||0)/100);return ms>1.5e12&&ms<Date.now()+864e5?new Date(ms):null};
 [...S.inv,...S.vou,...S.exp].forEach(r=>{const t=at(r);if(!t)return;if(!r.h){r.h=pd(t.getHours())+':'+pd(t.getMinutes());ch=1}const u=t.toISOString().slice(0,10),l=ld(t);if(r.d===u&&u!==l){r.d=l;ch=1}});
 S.chq.forEach(r=>{const t=at(r);if(!t||r.h)return;r.h=pd(t.getHours())+':'+pd(t.getMinutes());if(!r.d)r.d=ld(t);ch=1});
 if(ch)try{localStorage.setItem('daftar:acc',JSON.stringify(S))}catch(e){}}
let me=null,_c=0;Object.defineProperty(S,'n',{get(){return Date.now()*100+(_c++%100)},set(){}});
let DB=null,last={},ready=false;const G=['items','parties','inv','vou','exp','chq'];
const save=()=>{try{localStorage.setItem('daftar:acc',JSON.stringify(S))}catch(e){}push()};
function push(){if(!DB||!ready)return;G.forEach(g=>{const col=DB.collection(g),cur={};S[g].forEach(r=>{const k=String(r.id),j=JSON.stringify(r);cur[k]=1;if(last[g][k]!==j){last[g][k]=j;col.doc(k).set(JSON.parse(j)).catch(()=>{})}});Object.keys(last[g]).forEach(k=>{if(!(k in cur)){delete last[g][k];col.doc(k).delete().catch(()=>{})}})});const m={wh:S.wh,co:S.co,users:S.users,rates:S.rates,sh:S.sh,cats:S.cats},j=JSON.stringify(m);if(j!==last.meta){last.meta=j;DB.doc('app/meta').set(JSON.parse(j)).catch(()=>{})}}
const rr=()=>{const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;render()};
async function initDb(){try{const d=await claude.use('db');if(!d)return;DB=d;G.forEach(g=>last[g]={});last.meta='';const R={},got=new Set();let first=true;
const apply=()=>{G.forEach(g=>{S[g]=R[g]||[];last[g]={};S[g].forEach(r=>last[g][String(r.id)]=JSON.stringify(r))});if(R.meta){S.wh=R.meta.wh||S.wh;S.co=R.meta.co||S.co;S.users=R.meta.users||[];S.rates=R.meta.rates||S.rates;S.sh=R.meta.sh||S.sh;S.cats=R.meta.cats||S.cats;last.meta=JSON.stringify({wh:S.wh,co:S.co,users:S.users,rates:S.rates,sh:S.sh,cats:S.cats})}};
const after=()=>{if(got.size<G.length+1)return;if(first){first=false;const empty=G.every(g=>!R[g].length)&&!R.meta;if(!empty)apply();ready=true;if(empty)push();render()}else{apply();rr()}};
G.forEach(g=>d.collection(g).onSnapshot(s=>{R[g]=s.docs.map(x=>x.data()).sort((a,b)=>a.id-b.id);got.add(g);after()},()=>{}));
d.doc('app/meta').onSnapshot(s=>{R.meta=s.exists?s.data():null;got.add('meta');after()},()=>{})}catch(e){}}
const $=id=>document.getElementById(id),f=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2}),today=()=>ld(new Date()),ph=s=>String(s).replace(/\D/g,'').slice(-10);
const T=(m,bad)=>{const t=$('t');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(T.h);T.h=setTimeout(()=>t.className='',2300)};
const P=id=>S.parties.find(p=>p.id==id),pname=id=>(P(id)||{name:'نقدي'}).name;
const bal=p=>{let b=0;S.inv.forEach(i=>{if(i.p==p.id)b+=i.type=='sale'?i.total-i.paid:-(i.total-i.paid)});S.vou.forEach(v=>{if(v.p==p.id)b+=v.type=='in'||v.type=='d-'?-v.a:v.a});return b};
const cash=()=>S.inv.reduce((a,i)=>a+(i.type=='sale'?i.paid:-i.paid),0)+S.vou.reduce((a,v)=>a+(v.type=='in'?v.a:v.type=='out'?-v.a:0),0)-S.exp.reduce((a,e)=>a+e.a,0);
const balTxt=b=>b>0?`<b class="r">${f(b)} عليه</b>`:b<0?`<b class="g">${f(-b)} له</b>`:'0';
const inp=(id,l,t='text',x='')=>`<label>${l}<input id="${id}" ${t=='number'?'type="text" inputmode="decimal" onblur="fx(this)"':'type="'+t+'"'} ${x}></label>`;
const sel=(id,l,o,x='')=>`<label>${l}<select id="${id}" ${x}>${o}</select></label>`;
const opt=(a,v)=>a.map(([k,t])=>`<option value="${k}" ${k==v?'selected':''}>${t}</option>`).join('');
const wo=v=>opt(S.wh.map(w=>[w.id,w.name]),v),po=t=>opt(S.parties.filter(p=>!t||p.t==t).map(p=>[p.id,p.name]));
const tbl=(h,r,em='لا توجد بيانات بعد')=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="mut">${em}</td></tr>`}</table></div>`;
const card=(t,b)=>`<section class="card"><h2>${t}</h2>${b}</section>`;
const X=(k,id)=>`<button class="x" onclick="del('${k}',${id})">حذف</button>`;
const NAV=[['dash','📊','الرئيسية'],['sale','🛒','بيع'],['buy','📥','شراء'],['items','📦','المواد'],['stock','🗂️','المخزون'],['parties','👥','العملاء'],['vou','🧾','السندات'],['chq','🏦','الشيكات'],['exp','💸','المصروفات'],['rep','📈','التقارير'],['calc','🧮','الحاسبة'],['usr','⚙️','الإعدادات']];
const tabs=()=>me&&me.role=='cashier'?NAV.filter(t=>['sale','items','parties','calc'].includes(t[0])):NAV;
let tab='dash',cart=[],cp='',cpaid='',q='',stmt='',cw=0;
const go=t=>{tab=t;cart=[];cp='';cpaid='';q='';cq='';isq='';stmt='';dsq='';dlq='';drp=null;dfo=false;render();scrollTo(0,0)};
function render(){
 const lo=S.users.length&&!me;$('app').className=lo?'lo':'';
 if(lo){$('nav').innerHTML='';$('main').innerHTML=loginV();return}
 if(!tabs().some(t=>t[0]==tab))tab=tabs()[0][0];

function saveFile(name,blob,done){const ok=()=>{if(done)done()};
 if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{if(!d)return T('التصدير غير متاح هنا',1);return d.save({filename:name,data:blob}).then(ok)}).catch(()=>{});return}
